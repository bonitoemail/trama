# Relógios do Trama: datas e eventos que a realidade vai decidir.
# Lido por `npm run estado` e pela skill `atualizar-jogo`.
#
# Campos:
#   id          identificador estável
#   data        AAAA-MM-DD (quando há data marcada) ou omitido (evento sem data: "vigiar")
#   evento      o que acontece
#   frente      planalto | congresso | supremo | direita | mundo | economia
#   afeta       nós do jogo que o resultado decide ou muda (capitulo/no[:escolha])
#   status      pendente | aconteceu | descartado
#   resultado   (quando aconteceu) o que aconteceu, com fonte
#   conferir    onde/como checar
#
# Regra: quando um relógio vira "aconteceu", a skill decide se trava uma escolha (real),
# entra no prólogo, muda texto ou só ajusta o futuro.

relogios:
  # --- Capítulo 1: decisões em aberto, sem data marcada ---
  - id: preventiva-flavio
    evento: Moraes decide sobre o pedido de prisão (ou bloqueia bens sem prender); se prender, o Senado vota se mantém (Constituição, art. 53) e a Interpol decide sobre o alerta
    frente: supremo
    afeta: [cap01/pedido, cap01/a_votacao_da_prisao, cap01/foragido, cap01/o_cerco]
    status: pendente
    conferir: STF, PGR (parecer), Poder360, CNN, Metrópoles

  - id: resposta-carta-governo
    evento: governo responde ou não à carta; Itamaraty pede ou não explicações a EUA e Argentina
    frente: planalto
    afeta: [cap01/itamaraty]
    status: pendente
    conferir: Itamaraty (notas), Planalto, CNN, Folha

  - id: argentina-investigacao
    evento: Justiça argentina avança (ou não) sobre a saída de Flávio por Puerto Iguazú; papel de Caputo
    frente: mundo
    afeta: [cap01/a_rota]
    status: pendente
    conferir: elDiarioAR, La Nación, Clarín, Ámbito, Perfil

  - id: flavio-postura
    evento: Flávio volta a se dizer presidente / monta governo no exílio, ou fica como "líder" da oposição
    frente: direita
    afeta: [cap01/o_exilio]
    status: pendente
    conferir: redes de Flávio, Metrópoles, Folha, Gazeta do Povo

  - id: pl-postura
    evento: PL (Valdemar) negocia com Alcolumbre, une a oposição num nome só (Marinho ou Tereza Cristina, com Tarcísio), mantém Marinho e espera, ou abraça a carta
    frente: congresso
    afeta: [cap01/pl]
    status: pendente
    conferir: Poder360, Congresso em Foco, Gazeta do Povo, Folha

  - id: herdeira-direita
    evento: Tarcísio assume a oposição, o PL de Valdemar põe Michelle na frente, ninguém assume, ou a família briga em público
    frente: direita
    afeta: [cap02/a_herdeira]
    status: pendente
    conferir: redes de Tarcísio e de Michelle, PL, CNN, Folha, Gazeta do Povo

  - id: bloqueio-bens-flavio
    evento: Moraes decide sobre o pedido de bloqueio de até R$ 6 bilhões em bens de Flávio
    frente: supremo
    afeta: [cap02/a_conta]
    status: pendente
    conferir: STF, Poder360, Metrópoles

  - id: acordo-senado
    evento: PL fecha (ou não) com Alcolumbre antes do recesso; a oposição vai com Marinho ou Tereza Cristina; o PL racha; ou Alcolumbre fecha com o governo e isola o PL
    frente: congresso
    afeta: [cap02/a_mesa, cap02/a_contagem, cap02/a_oferta, cap02/o_lado_de_lula]
    status: pendente
    conferir: Folha, Poder360, Congresso em Foco, Agência Senado

  - id: deportacao-irmaos
    evento: governo Trump mantém a autorização de Flávio (com ou sem cobrar silêncio), responde a um pedido de asilo, ou cancela; a situação migratória de Eduardo segue a conferir
    frente: mundo
    afeta: [cap02/a_moeda]
    status: pendente
    conferir: Departamento de Estado, DHS, Axios, Metrópoles

  # --- Datas marcadas ---
  - id: midterms-2026
