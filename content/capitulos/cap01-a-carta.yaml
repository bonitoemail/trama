# Capítulo 1 — A carta
# Linguagem simples (DESIGN.md 8.2): cada parágrafo de `texto` é um cartão; o que aconteceu de verdade
# vai em `fatos` (com fontes) e as posições de cada lado vão em `lados`.
# Fatos: pesquisa/00-sintese.md, 01, 03, 06, 07, 09, 10 e RODADAS.md. Equilíbrio: DESIGN.md 8.1.
# Íntegra da carta (1ª versão): https://www.metropoles.com/brasil/veja-integra-de-carta-assinada-por-flavio-bolsonaro-apos-fugir-do-brasil
# Candidatas a trava (pesquisa/relogios.yaml): pedido, itamaraty, a_rota, eleicao_eua, o_exilio, pl.
id: cap01
numero: 1
titulo: A carta
periodo: fim de outubro a novembro de 2026
rascunho: true
inicio: abertura

nos:
  - id: abertura
    lugar: Miami e Brasília, 29 de outubro
    imagem: imagens/cap01/abertura.webp
    texto:
      - Flávio Bolsonaro perdeu a eleição para Lula por pouco. Dois dias depois, mesmo proibido pelo Supremo de sair do país, foi para Miami com a família.
      - Ele entrou nos Estados Unidos com uma autorização de um ano para ficar. Não é asilo político.
      - Na mesma noite, publicou uma carta dizendo que era o verdadeiro presidente. Horas depois, trocou a palavra por "líder do Brasil".
      - A carta fala em fraude, sem provas. E aponta Rogério Marinho como seu candidato para comandar o Senado.
    # Parole: pesquisa 07. Prorrogação e votos após as 17h: pesquisa 03 e 06. Três versões da carta: pesquisa 10.
    # Outras fontes da pesquisa (04 e 05), não usadas nos fatos:
    #   https://www.gazetadopovo.com.br/republica/moraes-ordena-cancelamento-de-passaporte-de-flavio-bolsonaro-apos-eleicoes/
    #   https://www.aosfatos.org/noticias/derrotado-flavio-mente-sugerir-eleicao-fraudada/
    #   https://www.aljazeera.com/news/2026/10/27/bolsonaros-party-accepts-result-after-trump-suggests-vote-was
    fatos:
      - texto: Flávio entrou nos Estados Unidos com uma autorização temporária (parole), que pode ser dada por razões humanitárias e vale até 27 de outubro de 2027, segundo registros da alfândega americana vistos pela imprensa. Não é asilo.
        fontes:
          - https://www.metropoles.com/colunas/igor-gadelha/flavio-entrou-nos-eua-com-autorizacao-humanitaria-de-1-ano-de-permanencia
          - https://jornaldebrasilia.com.br/noticias/politica-e-poder/flavio-bolsonaro-chega-aos-eua-com-status-que-permite-ficar-1-ano/
          - https://ndmais.com.br/politica/flavio-bolsonaro-recebe-autorizacao-para-ficar-um-ano-nos-eua/
      - texto: A Polícia Federal disse, em nota, que descumprir a restrição aos passaportes não caracteriza a condição de foragido nem autoriza a prisão.
        fontes:
          - https://www.gazetadopovo.com.br/republica/pf-viagem-flavio-eua-nao-caracteriza-fuga-nem-prisao/
          - https://www.poder360.com.br/poder-justica/decisao-de-moraes-nao-autorizava-prisao-de-flavio-diz-pf/
      - texto: Flávio é investigado em três inquéritos no Supremo, sem denúncia. Um trata de suspeita de lavagem de dinheiro ligada ao advogado Willer Tomaz e a apostas; outro, do financiamento do filme sobre o pai; o terceiro, de calúnia contra Lula. Flávio nega irregularidades.
        fontes:
          - https://www.cnnbrasil.com.br/politica/inqueritos-contra-flavio-podem-continuar-no-stf-mesmo-com-perda-de-foro/
          - https://www.metropoles.com/brasil/flavio-perde-eleicao-o-que-muda-nos-inqueritos-contra-ele
          - https://www.congressoemfoco.com.br/noticia/123352/flavio-e-alvo-de-inquerito-na-pf-por-suspeita-de-lavagem-de-dinheiro
      - texto: Logo depois da eleição, Moraes proibiu Flávio de sair do país e mandou entregar os passaportes.
        fontes:
          - https://www.gazetadopovo.com.br/republica/flavio-bolsonaro-tem-passaportes-apreendidos-e-esta-proibido-de-deixar-o-pais/
          - https://agenciabrasil.ebc.com.br/politica/noticia/2026-10/moraes-manda-flavio-entregar-passaporte-e-o-proibe-de-deixar-o-pais
      - texto: O fato real que a carta usa é a prorrogação do horário de votação até as 19h, decidida pelo ministro Cristiano Zanin a pedido da campanha de Lula. A medida veio depois de as duas campanhas relatarem problemas no dia da votação.
        fontes:
          - https://www.tse.jus.br/comunicacao/noticias/2026/Outubro/eleicoes-2026-mais-de-34-mil-votos-foram-registrados-apos-as-17h-no-2o-turno
          - https://www.poder360.com.br/poder-eleicoes-2026/zanin-prorroga-votacao-do-2o-turno-ate-19h/
      - texto: Depois das 17h votaram cerca de 34 mil pessoas. A diferença final entre os dois foi de cerca de 4,4 milhões de votos.
        fontes:
          - https://www.tse.jus.br/comunicacao/noticias/2026/Outubro/eleicoes-2026-mais-de-34-mil-votos-foram-registrados-apos-as-17h-no-2o-turno
          - https://www.tse.jus.br/comunicacao/noticias/2026/Outubro/presidente-do-tse-anuncia-reeleicao-de-lula-e-faz-balanco-do-2o-turno-das-eleicoes-2026
      - texto: Valdemar Costa Neto, presidente do PL, reconheceu o resultado em nota de 26 de outubro, e cobrou esclarecimentos sobre os gastos do governo perto da votação.
        fontes:
          - https://agenciabrasil.ebc.com.br/politica/noticia/2026-10/partido-de-flavio-pl-reconhece-vitoria-de-lula-nas-eleicoes
          - https://oantagonista.com.br/brasil/pl-reconhece-vitoria-de-lula-mas-reforca-duvidas-sobre-eleicao/
    segue: pedido

  - id: pedido
    lugar: Brasília, Supremo Tribunal Federal
    imagem: imagens/cap01/pedido.webp
    texto:
      - Deputados do PT pedem a prisão de Flávio. Dizem que ele fugiu para não responder à Justiça.
      - Os aliados dele dizem que é perseguição política. Para a Polícia Federal, sair do país contra a ordem não faz dele um foragido.
      - Quem decide é Alexandre de Moraes, o ministro do Supremo que cuida do caso.
      - Prender pode transformar Flávio em mártir. Não prender pode passar a ideia de que a lei não vale para ele.
    fatos:
      - texto: Os deputados do PT Lindbergh Farias, Rogério Correia e Ana Elisa Santos pediram a Moraes a prisão preventiva de Flávio e o nome dele no alerta vermelho da Interpol, por ter descumprido a ordem sobre os passaportes.
        fontes:
          - https://www.poder360.com.br/poder-congresso/pt-pede-prisao-de-flavio-bolsonaro-e-alerta-vermelho-da-interpol/
          - https://www.gazetadopovo.com.br/republica/pt-pede-prisao-preventiva-de-flavio-bolsonaro-e-inclusao-na-difusao-vermelha-da-interpol/
      - texto: Deputados do PT também pediram ao Supremo o bloqueio de até R$ 6 bilhões em bens de Flávio.
        fontes:
          - https://www.metropoles.com/colunas/neila-guimaraes/pt-pede-bloqueio-de-ate-r-6-bilhoes-de-flavio-bolsonaro
          - https://timesbrasil.com.br/brasil/pt-pede-ao-stf-bloqueio-de-ate-r-6-bilhoes-em-bens-de-flavio-bolsonaro/
      - texto: Parlamentares do PSOL pediram ao Senado que avalie suspender o salário de Flávio e, se houver base legal, declarar a perda do mandato.
        fontes:
          - https://brasil.perfil.com/politica/flavio-bolsonaro-e-alvo-de-pedido-de-perda-de-mandato-e-corte-de-salario-apos-viagem-aos-eua.phtml
          - https://www.poder360.com.br/poder-justica/deputados-do-psol-protocolam-pedido-de-cassacao-de-flavio-no-senado/
          - https://oantagonista.com.br/brasil/duda-salabert-pede-a-alcolumbre-suspensao-do-salario-de-flavio/
      - texto: Rogério Marinho questionou o momento das medidas contra Flávio, pedidas pela Polícia Federal logo depois da proclamação do resultado.
        fontes:
          - https://oantagonista.com.br/brasil/rogerio-marinho-diz-que-nao-foi-avisado-sobre-saida-de-flavio-do-pais/
          - https://www.gazetadopovo.com.br/republica/rogerio-marinho-cita-surpresa-com-viagem-de-flavio-e-questiona-medidas-de-moraes/
      - texto: Em 2019, a então procuradora-geral Raquel Dodge mandou arquivar o inquérito das fake news, aberto pelo próprio Supremo. Disse que só o Ministério Público pode acusar. Moraes, relator, manteve o inquérito.
        fontes:
          - https://www.poder360.com.br/justica/inquerito-aberto-para-investigar-fake-news-ao-stf-vai-continuar-diz-moraes/
          - https://www.metropoles.com/brasil/justica/raquel-dodge-arquiva-inquerito-de-fake-news-e-ofensas-contra-stf
    # Defesa de Moraes ("acerto histórico", 2023), só uma fonte; ficou como posição em `lados`:
    #   https://www.opovo.com.br/noticias/politica/2023/03/31/alexandre-diz-que-inquerito-das-fake-news-foi-acerto-historico-do-stf.html
    # PGR em reserva ("precipitada"): só a CNN apurou, os outros reproduzem; fora dos fatos.
    #   https://www.cnnbrasil.com.br/blogs/taina-falcao/politica/decisao-de-moraes-contra-flavio-gera-criticas-na-cupula-da-pgr/
    lados:
      - Para a esquerda, prender mostraria que a lei vale para todos, e manter Flávio no noticiário também rende votos. Para o PL, cada pedido do PT reforça a história da perseguição, que também mobiliza a base.
      - Para Moraes, decidir rápido reforça a autoridade do Supremo no caso. Recuar pode ser lido como fraqueza, e prender, como pressa.
      - Críticos do Supremo lembram o inquérito das fake news e dizem que o tribunal não pode investigar e julgar no mesmo caso. Para Moraes e quem o defende, aquele inquérito protegeu o tribunal e a democracia.
    escolhas:
      - id: preventiva
        rotulo: Moraes manda prender Flávio
        vai_para: a_votacao_da_prisao
      - id: espera
        rotulo: Moraes espera e não decide agora
        marca: [flavio_sem_preventiva]
        vai_para: o_prazo
      - id: pgr
        rotulo: A Procuradoria se manifesta contra, e Moraes não prende
        marca: [flavio_sem_preventiva, pgr_contra]
        vai_para: o_parecer
      - id: bloqueia_sem_prender
        rotulo: Moraes não prende, mas bloqueia parte dos bens
        marca: [flavio_sem_preventiva, bloqueio_sem_prisao]
        vai_para: o_prazo

  # A prisão de senador passa pelo Senado (Constituição, art. 53). É o que faltava entre a ordem e a Interpol.
  # Precedente real: Delcídio do Amaral, 2015. A fundamentação da ordem e a votação são simulação.
  - id: a_votacao_da_prisao
    lugar: Brasília, plenário do Senado
    imagem: imagens/cap01/a_votacao_da_prisao.webp
    texto:
      - Moraes manda prender Flávio. Senador só pode ser preso em flagrante de crime inafiançável, e a maioria do Senado decide se a prisão continua.
      - A ordem diz que a fuga é um crime que continua acontecendo. A defesa lembra que a Polícia Federal disse que ele não é foragido, e que isso não é flagrante.
      - Alcolumbre, o presidente do Senado, marca a votação para a mesma noite. Ninguém quer votar, e todos vão ter de votar.
    fatos:
      - texto: Pela Constituição, deputados e senadores só podem ser presos em flagrante de crime inafiançável. Nesse caso, o processo vai à Casa em 24 horas, e a maioria decide se a prisão continua.
        fontes:
          - https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm
      - texto: Em novembro de 2015, o Senado decidiu manter, por 59 votos a 13, a prisão do senador Delcídio do Amaral, determinada pelo Supremo.
        fontes:
          - https://www12.senado.leg.br/noticias/materias/2015/11/25/senadores-decidem-manter-prisao-de-delcidio-do-amaral
    lados:
      - Para quem pede a prisão, um senador que foge não pode se esconder atrás do mandato. Para quem é contra, prender um senador sem flagrante abre um precedente que vale para todos.
      - Para Alcolumbre, qualquer resultado custa votos em fevereiro. Para o PL, é a primeira chance de mostrar que o Senado protege os seus.
    escolhas:
      - id: senado_mantem
        rotulo: O Senado mantém a prisão de Flávio
        marca: [flavio_preventiva]
        vai_para: foragido
      - id: senado_derruba
        rotulo: O Senado derruba a prisão
        marca: [flavio_sem_preventiva, prisao_derrubada]
        vai_para: o_prazo

  - id: foragido
    lugar: Miami, dias depois
    imagem: imagens/cap01/foragido.webp
    texto:
      - O Senado mantém a prisão. Moraes pede que o nome de Flávio entre no alerta internacional de procurados.
      - A primeira versão da carta dizia que não havia ordem de prisão contra ele. A ordem saiu dias depois.
      - Ele grava um vídeo de Miami. Diz que é perseguido e que continua sendo o líder do Brasil.
    # "não existe nenhum mandado de prisão contra mim": 1ª versão da carta.
    # Trilho A, "A caçada": com Flávio foragido, a frente é a polícia e Washington, não a diplomacia com Milei.
    # Pula itamaraty e a_rota e volta à espinha em eleicao_eua.
    fatos:
      - texto: O alerta vermelho da Interpol é um pedido, não uma ordem de prisão internacional. Cada país decide, pelas próprias leis, se prende ou não.
        fontes:
          - https://www.congressoemfoco.com.br/noticia/109168/o-que-e-o-alerta-vermelho-da-interpol-contra-carla-zambelli
          - https://www.em.com.br/internacional/2026/07/7466633-difusao-vermelha-o-que-e-o-alerta-maximo-emitido-pela-interpol.html
      - texto: Eduardo Bolsonaro, condenado pelo Supremo por coação no curso do processo e com mandado de prisão no Brasil, vive nos Estados Unidos desde 2025.
        fontes:
          - https://agenciabrasil.ebc.com.br/justica/noticia/2026-10/moraes-determina-emissao-de-mandado-de-prisao-contra-eduardo-bolsonaro
          - https://www.brasildefato.com.br/2026/10/08/stf-determina-prisao-cancelamento-de-passaportes-e-perda-de-cargo-de-eduardo-bolsonaro/
          - https://www.gazetadopovo.com.br/republica/moraes-manda-iniciar-cumprimento-pena-eduardo-bolsonaro/
      - texto: A Interpol já recusou pedidos de Moraes contra brasileiros. Negou o de Allan dos Santos por falta de informações e o de Oswaldo Eustáquio citando a regra que a proíbe de agir em casos de caráter político.
        fontes:
          - https://www.poder360.com.br/poder-justica/lista-vermelha-interpol-ja-negou-outros-2-pedidos-de-moraes/
          - https://revistaoeste.com/politica/interpol-ja-negou-inclusao-de-allan-dos-santos-e-oswaldo-eustaquio-na-lista/
    lados:
      - Para quem pediu a prisão, a Interpol deve aceitar porque a acusação é de crime comum. Para a defesa, o caso é político, e a própria Interpol já disse isso de outros brasileiros.
    escolhas:
      - id: interpol_sim
        rotulo: A Interpol aceita o alerta contra Flávio
        marca: [interpol_aceita]
        vai_para: o_cerco
      - id: interpol_nao
        rotulo: A Interpol recusa, por ver o caso como político
        marca: [interpol_recusa]
        vai_para: a_recusa
      - id: interpol_espera
        rotulo: A Interpol pede mais informações e não decide
        marca: [interpol_espera]
        vai_para: o_cerco

  - id: o_cerco
    lugar: Brasília, Palácio do Planalto
    imagem: imagens/cap01/o_cerco.webp
    texto:
      - se: { tem: interpol_aceita }
        texto: A Interpol aceita. O nome de Flávio entra no alerta internacional de procurados. Se ele sair dos Estados Unidos, pode ser preso em qualquer escala.
        senao: Sem o alerta da Interpol, resta o caminho direto, pedir aos Estados Unidos que mandem Flávio de volta.
      - O pedido sai do Supremo, mas passa pelo governo. No Planalto, a pergunta é se pede agora a Trump, e quanto isso custa na conversa sobre a taxa.
    fatos:
      - texto: Pela lei americana, a extradição passa por um juiz, que ouve as provas, e só depois vai ao secretário de Estado.
        fontes:
          - https://www.govinfo.gov/content/pkg/USCODE-2023-title18/html/USCODE-2023-title18-partII-chap209-sec3184.htm
    lados:
      - Para o PT, não pedir a extradição é tratar um foragido como hóspede. Para quem negocia com Washington, pedir agora é dar a Trump mais um motivo para manter a taxa.
      - Para juristas do governo, depois de fevereiro, sem o mandato de senador, o pedido fica mais forte. Para a oposição, esperar é só um jeito de não decidir.
    escolhas:
      - id: pede_extradicao
        rotulo: O governo pede a extradição de Flávio aos EUA
        marca: [extradicao_pedida]
        vai_para: eleicao_eua
      - id: espera_fevereiro
        rotulo: O governo espera o mandato dele acabar em fevereiro
        marca: [extradicao_em_fevereiro]
        vai_para: eleicao_eua
      - id: guarda_extradicao
        rotulo: O governo não pede, para não brigar com Trump
        marca: [extradicao_guardada]
        vai_para: eleicao_eua

  - id: a_recusa
    lugar: Washington, Capitólio
    imagem: imagens/cap01/a_recusa.webp
    texto:
      - A Interpol recusa. Diz que o caso tem caráter político.
      - Em Miami, Flávio mostra a resposta como prova de perseguição. Eduardo leva o papel a deputados republicanos.
      - No Brasil, a ordem de prisão continua valendo. Fora dele, ninguém é obrigado a cumpri-la.
    # Simulação: a recusa no caso de Flávio e a agenda de Eduardo. Real: as recusas anteriores (fatos em foragido).
    lados:
      - Para a família, a recusa é a sentença que faltava, vinda de fora. Para quem pediu a prisão, é uma regra de procedimento, e o crime investigado continua o mesmo.
    segue: o_cerco


  - id: o_prazo
    lugar: Brasília, Senado Federal
    imagem: imagens/cap01/o_prazo.webp
    texto:
      - se: { tem: prisao_derrubada }
        texto: O Senado derrubou a prisão. Agora, o relógio que importa é outro. Senador que falta demais pode perder o cargo.
        senao: Sem prisão, o relógio que importa é outro. Senador que falta demais pode perder o cargo.
      - As faltas de Flávio chegam ao limite em dezembro. Quem comanda esse processo é Davi Alcolumbre, o presidente do Senado.
      - Alcolumbre quer ser reeleito presidente do Senado em fevereiro. E a carta de Flávio apoiou o rival dele.
    # Data estimada (~17/12): Diario de Pernambuco (pesquisa 03). Rito, com a passagem pela CCJ (RISF, art. 32): pesquisa 09.
    fatos:
      - texto: Pela Constituição, perde o mandato quem faltar a um terço das sessões ordinárias do ano sem licença. A perda não é automática. A Mesa do Senado a declara, por conta própria ou a pedido de um senador ou partido, com direito a defesa.
        fontes:
          - https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm
      - texto: Pela projeção da Agência Senado, o PL terá 29 senadores a partir de fevereiro, a maior bancada da Casa.
        fontes:
          - https://acritica.net/nacional/composicao-senado-2027-pl-29-senadores-19-mulheres/
          - https://www12.senado.leg.br/noticias/materias/2026/10/25/fim-da-eleicao-define-composicao-do-senado-em-2027-com-13-partidos
    segue: itamaraty

  - id: o_parecer
    lugar: Brasília, Procuradoria-Geral da República
    imagem: imagens/cap01/o_parecer.webp
    texto:
      - A Procuradoria-Geral, que faz a acusação nos processos, dá parecer contra a prisão. Diz que os motivos não bastam para prender um senador.
      - Moraes não manda prender. A oposição chama de recuo; o governo, de prudência.
      - Flávio comemora. Em Brasília, a pergunta passa a ser quem se dispõe a contrariar o Supremo, e o que ganha com isso.
    # Simulação: o parecer e o pedido de arquivamento. Real: a PGR criticou em reserva a medida dos passaportes (pesquisa 06).
    lados:
      - Para a defesa, o parecer mostra que nem a acusação vê base para prender. Para quem pediu a prisão, a Procuradoria protege um político que saiu do país contra a ordem.
    escolhas:
      - id: pgr_arquiva
        rotulo: A Procuradoria pede para arquivar um dos inquéritos
        marca: [pgr_pede_arquivamento]
        vai_para: itamaraty
      - id: pgr_so_prisao
        rotulo: A Procuradoria só se opõe à prisão
        vai_para: itamaraty

  - id: itamaraty
    lugar: Brasília, Palácio do Itamaraty
    imagem: imagens/cap01/itamaraty.webp
    texto:
      - A carta agradece a dois presidentes estrangeiros. A Milei, da Argentina, pela coragem. A Trump, por acolher Flávio.
      - se: { tem: flavio_preventiva }
        texto: E o Brasil tem uma ordem de prisão contra o homem que agradeceu aos dois.
      - Lula chamou a fuga de vergonhosa e disse que a família lambe as botas dos Estados Unidos. Depois, mandou os ministros pararem de falar do assunto.
      - Responder dá importância à carta. Ficar calado deixa a carta sem resposta.
    # "lambe botas" também em Tribuna do Sertão / NBC (pesquisa 03).
    fatos:
      - texto: Lula disse que a saída de Flávio do Brasil foi um ato vergonhoso e que a primeira pátria da família Bolsonaro é "lamber bota" dos americanos.
        fontes:
          - https://www.gazetadopovo.com.br/republica/lula-chama-viagem-de-flavio-de-vergonhosa-e-lembra-da-propria-prisao-na-lava-jato/
          - https://sbtnews.sbt.com.br/noticia/politica/quem-sai-escondido-deve-algo-diz-lula-sobre-flavio
      - texto: O governo orientou os ministros a não explorar o caso e a deixá-lo com a Polícia Federal e a Justiça. O motivo dito é não alimentar o discurso de perseguição à família Bolsonaro.
        fontes:
          - https://www.cnnbrasil.com.br/blogs/taina-falcao/politica/lula-orienta-ministros-a-nao-explorar-fuga-de-flavio/
          - https://www.metropoles.com/brasil/planalto-orienta-ministros-a-tratar-fuga-de-flavio-como-caso-de-justica
      - texto: Em reserva, integrantes do governo e aliados de Lula disseram a jornalistas que a decisão de Moraes sobre os passaportes veio em mau momento e pode reforçar a ideia de perseguição.
        fontes:
          - https://www.metropoles.com/colunas/milena-teixeira/ministros-de-lula-culpam-moraes-por-possivel-fuga-de-flavio-bolsonaro
          - https://timesbrasil.com.br/brasil/decisao-de-moraes-sobre-passaportes-de-flavio-causa-incomodo-no-governo-e-discurso-de-perseguicao-preocupa-lula/
    lados:
      - Para o governo, ficar calado tira o palco de Flávio e evita ter de defender em público uma decisão de Moraes que nem todos no Planalto apoiam. Para a oposição, o silêncio é sinal de que o governo prefere não ser cobrado pela decisão.
      - Para o Itamaraty do chanceler Mauro Vieira, a conversa sobre a taxa com Washington pesa mais que a carta. Com a Argentina, a relação já estava rebaixada desde agosto. Pedir dados pela polícia, e não pela diplomacia, evita uma crise nova.
    escolhas:
      - id: silencio
        rotulo: Lula ignora a carta
        marca: [governo_silencio]
        vai_para: a_rota
      - id: policia
        rotulo: O governo pede dados à Argentina pela Polícia Federal
        marca: [pedido_policial]
        vai_para: a_rota
      - id: rubio
        rotulo: Mauro Vieira leva o caso a Rubio, sem nota
        marca: [caso_com_rubio]
        vai_para: a_rota
      - id: cobra
        rotulo: Lula cobra explicações de Trump e de Milei
        marca: [crise_diplomatica]
        vai_para: a_rota

  - id: a_rota
    lugar: Buenos Aires, início de novembro
    imagem: imagens/cap01/a_rota.webp
    texto:
      - Na Argentina, a fuga virou escândalo. Flávio cruzou a fronteira por terra e pegou um jatinho do lado argentino. A Justiça de lá já investiga.
      - A oposição argentina acusa o governo Milei de ter ajudado. O governo nega. Um assessor de Milei é citado pela imprensa argentina, e também nega.
      - se: { tem: crise_diplomatica }
        texto: O pedido de explicações do Brasil chega no meio da briga.
      - se: { tem: pedido_policial }
        texto: O pedido da Polícia Federal chega à Justiça argentina, sem nota e sem discurso.
      - se: { tem: governo_silencio }
        texto: O Brasil não pediu nada. Quem faz as perguntas é a oposição argentina.
      - Sobre a carta que o agradece, Milei não diz uma palavra.
    # Negativa do governo argentino ("de manera enfática"): Perfil, 28/10 (link abaixo, no fato do Caputo).
    fatos:
      - texto: A imigração argentina registrou a entrada de Flávio pela ponte de Foz do Iguaçu às 22h50 de 27 de outubro. Às 23h30, ele embarcou num jato fretado com destino declarado a Guayaquil, no Equador.
        fontes:
          - https://www.cnnbrasil.com.br/internacional/argentina-diz-que-flavio-entrou-no-pais-na-noite-de-terca-e-voou-ao-equador/
          - https://www.poder360.com.br/poder-internacional/flavio-cruzou-a-fronteira-e-pegou-aviao-para-o-equador-diz-migracao-argentina/
          - https://www.ambito.com/politica/fuga-flavio-bolsonaro-la-justicia-argentina-ya-investiga-y-ordena-medidas-n6338971
      - texto: Deputados da oposição argentina apresentaram denúncias penais contra o governo. A deputada Marcela Pagano pediu à Justiça as câmeras, os planos de voo, a lista de passageiros e o contrato do fretamento.
        fontes:
          - https://www.eldiarioar.com/politica/oposicion-denuncio-milei-fuga-bolsonaro-pidio-interpelar-funcionarios-gobierno_1_13622906.html
          - https://www.ambito.com/politica/fuga-flavio-bolsonaro-la-justicia-argentina-ya-investiga-y-ordena-medidas-n6338971
      - texto: Santiago Caputo, assessor de Milei, rejeita as notícias sobre seu papel na saída de Flávio.
        fontes:
          - https://www.perfil.com/politica/tension-en-el-gobierno-tras-el-escape-de-bolsonaro-a-ee.uu.-bullrich-se-desmarco-de-milei-y-siguen-las-dudas-sobre-el-rol-de-santiago-caputo-abCex7S7Kv4m
          - https://www.lanacion.com.ar/politica/santiago-caputo-fue-identificado-por-un-control-policial-tras-el-operativo-de-huida-de-bolsonaro-nid28102026/
      - texto: A Justiça argentina já investiga. Uma denúncia contra o governo está com a juíza María Eugenia Capuchetti, e o fiscal federal de Puerto Iguazú pediu informações a órgãos oficiais.
        fontes:
          - https://www.ambito.com/politica/fuga-flavio-bolsonaro-la-justicia-argentina-ya-investiga-y-ordena-medidas-n6338971
          - https://www.tiempoar.com.ar/ta_article/la-jueza-capuchetti-investigara-la-denuncia-contra-el-gobierno-por-ayudar-en-la-fuga-de-bolsonaro
      - texto: A senadora Patricia Bullrich, do partido de Milei, defendeu que a vontade das urnas no Brasil seja respeitada.
        fontes:
          - https://www.perfil.com/politica/tension-en-el-gobierno-tras-el-escape-de-bolsonaro-a-ee.uu.-bullrich-se-desmarco-de-milei-y-siguen-las-dudas-sobre-el-rol-de-santiago-caputo-abCex7S7Kv4m
          - https://www.infobae.com/politica/2026/10/28/patricia-bullrich-reconocio-el-triunfo-de-lula-en-brasil-y-cuestiono-la-utilizacion-de-la-justicia-para-perseguir-a-flavio-bolsonaro/
    escolhas:
      - id: chega_ao_governo
        rotulo: A investigação chega perto do governo Milei
        marca: [caputo_investigado]
        vai_para: o_voo_fretado
      - id: interpelacao
        rotulo: O Congresso argentino chama o chanceler para explicar
        marca: [chanceler_interpelado]
        vai_para: eleicao_eua
      - id: silencio_milei
        rotulo: A investigação não acha participação do governo
        marca: [milei_silencio]
        vai_para: eleicao_eua

  - id: o_voo_fretado
    lugar: Puerto Iguazú, novembro
    imagem: imagens/cap01/o_voo_fretado.webp
    texto:
      - A juíza do caso cruza os papéis que a deputada Marcela Pagano pediu. Câmeras do aeroporto, planos de voo, lista de passageiros e o contrato do jatinho.
      - Se alguém do governo argentino ajudou, vai aparecer nesses papéis. Se ninguém ajudou, também.
      - A fuga deixa de ser um caso só do Brasil. Os aliados de Flávio dizem que a Argentina só carimbou um passaporte.
    segue: eleicao_eua

  - id: eleicao_eua
    lugar: Miami, 3 de novembro
    imagem: imagens/cap01/eleicao_eua.webp
    texto:
      - Os Estados Unidos votam para escolher o novo Congresso.
      - Em Miami, Flávio e o irmão Eduardo acompanham pela TV. Na carta, Flávio chamou Trump de grande defensor da liberdade.
      - se: { tem: flavio_preventiva }
        texto: Para um foragido, a eleição decide quem manda no Congresso que pode pressionar Trump, a favor dele ou contra.
        senao: Se os adversários de Trump ganharem, a pressão contra Flávio nos Estados Unidos cresce.
    # "grande defensor da liberdade de expressão": íntegra da carta.
    fatos:
      - texto: Às vésperas da eleição, as pesquisas dão vantagem aos democratas na disputa pela Câmara. A aprovação de Trump está perto das mais baixas do mandato.
        fontes:
          - https://theconversation.com/democrats-remain-clear-favourites-to-gain-control-of-congress-at-midterms-as-trumps-ratings-slide-again-295134
          - https://www.fox29.com/news/trump-approval-hits-record-low-midterms-near-poll.amp
    lados:
      - se: { tem: crise_diplomatica }
        texto: O pedido de explicações do Itamaraty ainda não teve resposta de Washington. Para o governo, o silêncio americano já diz algo. Para os aliados de Flávio, mostra que o pedido não pesou.
    escolhas:
      - id: dividido
        rotulo: Democratas ganham a Câmara, e republicanos seguram o Senado
        marca: [eua_dem_camara, eua_senado_rep]
        vai_para: noite_democrata
      - id: democratas
        rotulo: Os democratas ganham a Câmara e o Senado
        marca: [eua_dem_camara]
        vai_para: noite_democrata
      - id: republicanos
        rotulo: Os republicanos, partido de Trump, mantêm a Câmara
        marca: [eua_rep_congresso]
        vai_para: noite_republicana

  - id: noite_democrata
    lugar: Washington, 4 de novembro
    imagem: imagens/cap01/noite_democrata.webp
    texto:
      - Os democratas ganham a Câmara. E já têm uma lista de assuntos. O Brasil está nela.
      - Uma reportagem disse que funcionários do governo Trump fizeram campanha para a família Bolsonaro voltar ao poder. Os democratas querem que eles deponham em janeiro.
      - se: { tem: eua_senado_rep }
        texto: Mas o Senado fica com os republicanos, e a taxa de 25% sobre a maior parte dos produtos brasileiros continua. Quem decide a taxa é o governo Trump.
        senao: Mas a taxa de 25% sobre a maior parte dos produtos brasileiros continua. Quem decide isso é o governo Trump, não o Congresso.
    fatos:
      - texto: Uma reportagem da Reuters, com base em dez fontes, disse que dois funcionários do Departamento de Estado, Darren Beattie e Ricardo Pita, atuaram para a família Bolsonaro voltar ao poder. A Reuters não conseguiu saber se eles agiam por ordem da Casa Branca.
        fontes:
          - https://www.thestar.com.my/news/world/2026/10/25/inside-the-trump-administration-campaign-to-return-brazils-bolsonaro-clan-to-power
          - https://www.yahoo.com/news/politics/articles/inside-trump-administration-campaign-return-214506018.html
      - texto: No Brasil, o ministro Flávio Dino mandou a Polícia Federal investigar outra suspeita de interferência estrangeira, ligada a empresários e a um grupo americano, e se houve interesse em terras raras. Um dos empresários citados nega.
        fontes:
          - https://www.congressoemfoco.com.br/noticia/129246/dino-manda-pf-investigar-possivel-interferencia-externa-nas-eleicoes
          - https://www.gazetadopovo.com.br/republica/dino-manda-pf-investigar-suposto-financiamento-estrangeiro-a-campanha-de-flavio/
      # A Reuters cita tarifas de 50%: eram as de 2025, pela lei de emergência (IEEPA), derrubadas na
      # Suprema Corte americana. A que vale hoje é a de 25%, pela Seção 301 (pesquisa/05, item 18).
      - texto: Desde 22 de julho de 2026, uma tarifa de 25% vale para a maior parte dos produtos brasileiros que entram nos Estados Unidos. Ficaram de fora itens como carne bovina, café, energia e aviões. A decisão é do governo americano, não do Congresso.
        fontes:
          - https://ustr.gov/about/policy-offices/press-office/press-releases/2026/july/ustr-section-301-action-brazils-unreasonable-acts-policies-and-practices
          - https://www.nbcnews.com/world/brazil/us-launches-tariffs-25-tax-brazil-imports-rcna587780
    segue: o_exilio

  - id: noite_republicana
    lugar: Palm Beach, 4 de novembro
    imagem: imagens/cap01/noite_republicana.webp
    texto:
      - Os republicanos mantêm a Câmara. Trump comemora numa festa à beira-mar.
      - Em Miami, alívio. A reportagem sobre funcionários de Trump ajudando a família não deve virar investigação tão cedo.
      - Para o governo Lula, a conta é outra. A taxa de 25% fica, e as punições contra autoridades brasileiras, que Eduardo Bolsonaro pediu em Washington, podem voltar.
    # Eduardo e as sanções (2025) e o pedido de retomada (2026): InfoMoney e Gazeta do Povo.
    #   https://www.infomoney.com.br/politica/eduardo-bolsonaro-agradece-tarifa-de-trump-e-pede-apoio-de-sancoes-contra-moraes/
    #   https://www.gazetadopovo.com.br/republica/eduardo-diz-ter-pedido-a-trump-volta-de-moraes-a-magnitsky-e-cita-zelle-como-pix-dos-eua/
    fatos:
      - texto: Uma semana antes, Trump tinha dito duas coisas sobre o Brasil. Que a eleição pareceu fraudada, sem apresentar provas, e que ele gosta de Lula.
        fontes:
          - https://www.france24.com/en/live-news/20261027-lula-s-re-election-revives-brazil-us-tensions
          - https://batimes.com.ar/news/world/trump-slams-rigged-brazil-election-after-ally-flavio-bolsonaro-loses.phtml
          - https://www.irishtimes.com/world/americas/2026/10/27/trump-says-brazil-election-looked-rigged-as-bolsonaros-party-recognises-lula-win/
    segue: o_exilio

  - id: o_exilio
    lugar: Miami, novembro
    imagem: imagens/cap01/o_exilio.webp
    texto:
      - Flávio prometeu falar sempre aos brasileiros. Primeiro se disse presidente, depois líder do Brasil. Agora precisa decidir o que vai dizer.
      - Ele mesmo citou Guaidó, que se declarou presidente da Venezuela e foi reconhecido por dezenas de países.
      - Flávio não foi reconhecido por nenhum governo. Quase todos parabenizaram Lula, inclusive governos de direita. Milei e Trump não.
      - se: { tem: flavio_preventiva }
        texto: Com a ordem de prisão, voltar agora quer dizer ser preso na chegada.
        senao: E, enquanto ele fica fora, as faltas no Senado se acumulam.
    # Reconhecimentos de Lula: pesquisa 07.
    fatos:
      - texto: A autorização para ficar nos Estados Unidos vence em 27 de outubro de 2027, segundo registros da alfândega americana vistos pela imprensa.
        fontes:
          - https://www.metropoles.com/colunas/igor-gadelha/flavio-entrou-nos-eua-com-autorizacao-humanitaria-de-1-ano-de-permanencia
          - https://jornaldebrasilia.com.br/noticias/politica-e-poder/flavio-bolsonaro-chega-aos-eua-com-status-que-permite-ficar-1-ano/
    lados:
      - se: { tem: eua_dem_camara }
        texto: Para os democratas na Câmara, cada passo dele em Washington vai ser observado. Para os aliados de Flávio, quem decide a autorização ainda é o governo Trump.
        senao: Para os aliados de Flávio, com os republicanos firmes na Câmara, Washington não vai atrapalhar. Para o governo Lula, isso deixa a saída dele sem custo em Washington.
    escolhas:
      - id: governo
        rotulo: Flávio se diz presidente e monta um governo no exílio
        marca: [governo_exilio]
        vai_para: pl
      - id: voz
        rotulo: Flávio vira líder da oposição, com lives toda noite
        marca: [flavio_live]
        vai_para: pl
      - id: discreto
        rotulo: Flávio para de falar e deixa o caso aos advogados
        marca: [flavio_discreto]
        vai_para: pl
      - id: asilo
        rotulo: Flávio pede asilo político nos Estados Unidos
        marca: [asilo_pedido]
        vai_para: pl

  - id: pl
    lugar: Brasília, sede do PL
    imagem: imagens/cap01/pl.webp
    texto:
      - O PL, partido de Flávio, se reúne. A cadeira dele fica vazia.
      - Valdemar Costa Neto, o presidente do partido, já tinha aceitado a derrota. A carta disse o contrário.
      - se: { tem: governo_exilio }
        texto: E agora existe um governo no exílio. O partido não foi consultado sobre os nomes.
      - se: { tem: flavio_live }
        texto: E toda noite a live de Miami diz o que o partido deveria fazer. Nem sempre é o que o partido quer.
      - se: { tem: flavio_discreto }
        texto: E Flávio quase não fala. Sem a voz dele, o partido decide sozinho, e a base pergunta por quê.
      - Em fevereiro, o Senado escolhe seu presidente. União e PP já fecharam com Alcolumbre. Mas Tereza Cristina, do PP, conversa com Marinho sobre um nome só contra ele.
    # Marinho e Tereza Cristina negociando candidatura única, com o apoio de Tarcísio: RODADAS, 29/10 (InfoMoney, CNN).
    fatos:
      - texto: Os senadores Rogério Marinho, do PL, e Tereza Cristina, do PP, negociam uma candidatura única da oposição contra a reeleição de Alcolumbre. Tarcísio defende a candidatura única.
        fontes:
          - https://www.infomoney.com.br/politica/alcolumbre-enfrenta-avanco-da-direita-e-disputa-pelo-controle-do-senado-em-2027/
          - https://www.cnnbrasil.com.br/blogs/caio-junqueira/politica/tarcisio-projeta-lideranca-da-oposicao-e-candidatura-em-2030/
      - texto: Marinho foi lançado à presidência do Senado pelo próprio Valdemar, em 5 de outubro. Valdemar ligou a candidatura à vitória de Flávio.
        fontes:
          - https://www.congressoemfoco.com.br/noticia/122994/valdemar-diz-que-pl-quer-eleger-rogerio-marinho-presidente-do-senado
          - https://ndmais.com.br/politica/alcolumbre-senado-eleicao-lira-eleicoes-2026/
      - texto: Em 27 de outubro, um dia antes da carta, os presidentes do União Brasil e do PP anunciaram apoio à reeleição de Alcolumbre.
        fontes:
          - https://www.gazetadopovo.com.br/republica/uniao-pp-contrariam-alianca-flavio-apoio-reeleicao-alcolumbre/
          - https://www.diariodepernambuco.com.br/politica/2026/10/11727799-uniao-pp-declara-apoio-a-reeleicao-de-alcolumbre-para-presidente-do-senado.html
    lados:
      - A carta reafirmou o nome de Marinho justamente quando o partido pesava se a candidatura ainda valia a pena. Para quem quer negociar, insistir custa cargos. Para quem quer confronto, recuar custa a base.
      - Para quem quer um nome só, juntar PL e PP é a única chance de vencer Alcolumbre no voto secreto. Para os aliados de Flávio, trocar Marinho é ceder a quem aceitou a derrota.
      - se: { tem: crise_diplomatica }
        texto: No PL, a cobrança do Itamaraty é lida como um presente. A carta ganhou importância, e o partido, uma bandeira.
      - se: { tem: governo_silencio }
        texto: No PL, o silêncio de Lula é lido de dois jeitos. Uns veem medo; outros, cálculo.
      - se: { tem: flavio_preventiva }
        texto: Com a prisão decretada, defender Flávio em público passou a ter um custo, e a render votos.
      - se: { tem: flavio_sem_preventiva }
        texto: E há o relógio das faltas. Em dezembro, Alcolumbre pode decidir o mandato de Flávio.
    escolhas:
      - id: negocia
        rotulo: O PL negocia cargos com Alcolumbre
        marca: [pl_negocia]
        vai_para: a_ligacao
      - id: unida
        rotulo: A oposição se une em Tereza Cristina, com Tarcísio
        marca: [oposicao_unida]
        vai_para: o_nome_unico
      - id: espera
        rotulo: O PL mantém Marinho, longe da carta, e espera
        marca: [pl_espera]
        vai_para: o_racha
      - id: obstrui
        rotulo: O PL abraça a carta e parte para o confronto
        marca: [pl_obstrui]
        vai_para: a_convocacao

  # Final A — a semente do Acordo, com todos os lados dentro.
  # PEC da Segurança na conta do acordo: só O Antagonista (bastidor); ficou como motivo em `lados`.
  #   https://oantagonista.com.br/brasil/lula-e-alcolumbre-fecham-acordo-para-indicacao-de-pacheco-ao-stf/
  - id: a_ligacao
    lugar: Brasília, uma noite de novembro
    imagem: imagens/cap01/a_ligacao.webp
    texto:
      - Valdemar liga para Alcolumbre tarde da noite. A ligação não está na agenda de ninguém.
      - Falam de fevereiro. E de Rodrigo Pacheco, que Alcolumbre quer ver no Supremo ainda este ano.
      - Lula também quer Pacheco no Supremo. Ministros do Supremo também. A conversa tem mais de dois lados, e todos sabem.
      - É assim que começa um acordo. Com conversas que todo mundo confirma e ninguém conta.
    fatos:
      - texto: No dia seguinte à eleição, Alcolumbre e Hugo Motta, presidente da Câmara, visitaram Lula. Depois da visita, ganhou força a ideia de indicar Pacheco ao Supremo.
        fontes:
          - https://www.metropoles.com/brasil/indicacao-de-pacheco-para-o-stf-esta-escalando-dizem-aliados
          - https://oantagonista.com.br/brasil/lula-e-alcolumbre-fecham-acordo-para-indicacao-de-pacheco-ao-stf/
      - texto: Reportagens e colunas apontam que ministros do Supremo como Gilmar Mendes, Alexandre de Moraes, Flávio Dino e Cristiano Zanin preferem Pacheco para a vaga.
        fontes:
          - https://www.opovo.com.br/noticias/politica/2025/10/15/ala-politica-do-stf-prefere-rodrigo-pacheco-mas-senador-nao-e-unanimidade-entre-ministros.html
          - https://www.em.com.br/politica/2026/10/7529396-indicacao-de-rodrigo-pacheco-ao-stf-pode-levar-gleisi-para-o-tcu.html
    lados:
      - Para o governo, Pacheco no Supremo pode vir junto com o apoio de Alcolumbre a projetos parados no Senado, como a PEC da Segurança. Para Alcolumbre, emplacar um aliado no tribunal fortalece a reeleição. Para o PL, negociar agora rende espaço, mas deixa Marinho sozinho.
      - se: { tem: flavio_sem_preventiva }
        texto: As faltas de Flávio não entram na ligação. Não precisam.
      - se: { tem: flavio_preventiva }
        texto: Depois de fevereiro, quem presidir o Senado vai receber os pedidos de impeachment contra o ministro que mandou prender Flávio.
      - Na mesma noite, Marinho diz a aliados que continua candidato.

  # Final C — a frente: um nome só contra Alcolumbre.
  # Real: a negociação Marinho–Tereza Cristina e o apoio de Tarcísio (fatos em `pl`). Simulação: o almoço, a escolha de Tereza, a condição de Valdemar.
  - id: o_nome_unico
    lugar: Brasília, Senado Federal
    imagem: imagens/cap01/o_nome_unico.webp
    texto:
      - Marinho e Tereza Cristina almoçam juntos. Sai um nome só, o dela, que conversa com o PL e com o centro.
      - Tarcísio liga para os dois no mesmo dia. Valdemar aceita, desde que Marinho ganhe um lugar na Mesa.
      - Pela primeira vez, Alcolumbre conta votos com cuidado. No voto secreto, ninguém sabe quem vai trair quem.
      - Em Miami, a carta perde o candidato que tinha. No Planalto, a dúvida é se vale entrar nessa briga.
    lados:
      - Para quem apoia a frente, um nome que fala com o centro é o único que pode vencer Alcolumbre. Para os aliados de Flávio, a direita trocou o candidato da carta pelo de Tarcísio.
      - Para Alcolumbre, perder o PP muda a conta. Para o governo, apoiá-lo agora tem preço maior.

  # Final D — a espera: o PL fica com Marinho sem abraçar a carta e empurra a decisão. É o estado real em 28/10 (pesquisa 06, item d).
  # Real: aliados de Alcolumbre dentro do PL (pesquisa 09, "Estratégia de Alcolumbre"). Simulação: a reunião e o anúncio.
  - id: o_racha
    lugar: Brasília, sede do PL
    imagem: imagens/cap01/o_racha.webp
    texto:
      - A reunião acaba sem acordo. O PL fica com Marinho, não assina a carta e deixa a decisão para fevereiro.
      - Enquanto isso, os senadores do PL mais próximos de Alcolumbre avisam que não vão votar contra ele.
      - Em Miami, a família chama os dissidentes de traidores. Os dissidentes respondem que o partido precisa de espaço no Senado para atender os estados.
      - Para Alcolumbre, é o melhor cenário. O maior partido do Senado chega a fevereiro dividido.
    lados:
      - Para Valdemar, esperar evita escolher entre a carta e os cargos. Para a base, o silêncio é cobrado como medo, e para Alcolumbre, como chance de dividir o partido.

  # Final B — a briga
  - id: a_convocacao
    lugar: Brasília, Esplanada dos Ministérios
    imagem: imagens/cap01/a_convocacao.webp
    texto:
      - O PL marca um ato em Brasília para 15 de novembro. Marinho vai discursar como candidato a presidente do Senado.
      - se: { tem: flavio_preventiva }
        texto: O tema é a perseguição. A ordem de prisão vai estar nas faixas.
        senao: No telão, Flávio vai falar de Miami.
      - Tarcísio, governador de São Paulo, avisa que não vai. Para ele, a eleição acabou, e a briga é no Senado.
      - No governo, alívio discreto. Com a oposição na rua, o Planalto ganha um adversário para apontar. No Centrão, alguém faz as contas.
    lados:
      - Para o Centrão, com a oposição dividida entre a carta e o Senado, o apoio ao governo fica mais caro, e mais fácil de vender. Para o PL, a rua mostra que a base continua de pé, mesmo sem Flávio no país.

