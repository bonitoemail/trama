# RASCUNHO DE TESTE: texto provisório, feito para exercitar o motor.
id: cap02
numero: 2
titulo: O espólio
periodo: novembro de 2026
rascunho: true
inicio: abertura

nos:
  - id: abertura
    lugar: Novembro de 2026
    texto:
      - Três semanas depois da eleição, a direita tem votos, bancada e governadores. Falta uma voz.
      - se: { tem: pl_busca_nome }
        texto: A notícia de que o PL procura outro nome vazou, e todo mundo quer ser esse nome.
        senao: O PL fechou com Flávio, mas os aliados se perguntam quanto tempo isso aguenta.
      - se: { tem: flavio_asilo }
        texto: De Miami, cada post de Flávio vira notícia e vira problema.
    escolhas:
      - id: michelle
        rotulo: Michelle assume a dianteira e começa a rodar o país
        marca: [michelle_lidera]
      - id: tarcisio
        rotulo: Tarcísio de Freitas passa a ser tratado como o nome da direita
        marca: [tarcisio_lidera]
        vai_para: tarcisio
      - id: flavio_unifica
        rotulo: De longe, Flávio unifica a direita em torno de si
        se: { qualquer: [{ tem: flavio_convoca }, { tem: pl_com_flavio }] }
        marca: [flavio_lider_distancia]

  - id: tarcisio
    lugar: São Paulo, Palácio dos Bandeirantes
    texto:
      - O convite não vem por escrito. Vem num jantar, com três líderes de partido e nenhum assessor.
      - se: { tem: flavio_preso }
        texto: Com Flávio preso, aceitar significa herdar os eleitores dele, e também os inimigos.
    escolhas:
      - id: aceita
        rotulo: Tarcísio aceita o papel e começa a mirar 2030
        marca: [tarcisio_2030]
      - id: recua
        rotulo: Tarcísio recua e diz que o mandato é em São Paulo
        marca: [tarcisio_recua]

saidas:
  - para: FIM
