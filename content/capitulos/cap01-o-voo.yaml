# Capítulo 1 — O voo
# Fatos de partida: pesquisa/00-sintese.md (28/10/2026). Escolhas que a realidade decidir
# ganham `real: { data, fonte }` (DESIGN.md 6.1). Candidatas: pedido, eleicao_eua.
id: cap01
numero: 1
titulo: O voo
periodo: fim de outubro a novembro de 2026
rascunho: true
inicio: abertura

nos:
  - id: abertura
    lugar: Miami, 28 de outubro de 2026
    imagem: imagens/cap01/abertura.webp
    texto: |
      O jato pousa em Opa-locka pouco depois das dez da manhã. Flávio desce primeiro, a mulher
      e as filhas logo atrás. Não há discurso. Há um carro esperando e um assessor ao telefone.

      Em Brasília, a pergunta muda de dono a cada hora. Na véspera, todos queriam saber por onde
      ele tinha saído. Agora querem saber se ele vai voltar.

      Os fatos cabem em poucas linhas. O visto americano foi confirmado; o asilo, não. Flávio
      não é foragido: é senador até 31 de janeiro e investigado em dois inquéritos no Supremo,
      sem denúncia. Mas, desde a véspera, há um pedido de prisão sobre a mesa.
    segue: pedido

  - id: pedido
    lugar: Brasília, Supremo Tribunal Federal
    imagem: imagens/cap01/pedido.webp
    texto: |
      O pedido é do PT: prisão preventiva e o nome de Flávio no alerta vermelho da Interpol.
      A defesa responde que a viagem não foi fuga, que o senador tem endereço conhecido e nunca
      deixou de responder à Justiça.

      O gabinete do relator não comenta. Do lado de fora, as duas metades do país que votaram
      em outubro esperam a mesma decisão por motivos opostos.

      Prender agora transforma um senador em foragido internacional, e talvez em mártir.
      Esperar deixa no ar a sensação de que a ordem de entregar o passaporte valeu pouco.
    escolhas:
      - id: preventiva
        rotulo: O relator decreta a prisão preventiva e pede o alerta da Interpol
        marca: [flavio_preventiva]
        vai_para: eleicao_eua
      - id: espera
        rotulo: O relator mantém as medidas atuais e adia a decisão sobre a prisão
        marca: [flavio_sem_preventiva]
        vai_para: eleicao_eua

  - id: eleicao_eua
    lugar: Miami, 3 de novembro
    imagem: imagens/cap01/eleicao_eua.webp
    texto:
      - |
        Na terça-feira, os Estados Unidos votam para renovar o Congresso. Num apartamento
        alugado, Flávio e Eduardo acompanham a apuração com o som da televisão baixo.
      - se: { tem: flavio_preventiva }
        texto: |
          Desde a decisão do Supremo, o nome de Flávio circula em pedidos de cooperação
          internacional. O que Washington fará com ele depende, agora, de quem mandar no Capitólio.
        senao: |
          Sem ordem de prisão, Flávio tem tempo. O que ele não tem é a certeza de que o governo
          americano continuará do seu lado depois desta noite.
      - |
        As pesquisas dão vantagem aos democratas. Trump chega à eleição com a menor aprovação do
        mandato.
    escolhas:
      - id: democratas
        rotulo: Os democratas retomam a Câmara dos Representantes
        marca: [eua_dem_camara]
        vai_para: proximo_passo
      - id: republicanos
        rotulo: Os republicanos mantêm o controle das duas casas do Congresso
        marca: [eua_rep_congresso]
        vai_para: proximo_passo

  - id: proximo_passo
    lugar: Miami, novembro
    imagem: imagens/cap01/proximo_passo.webp
    texto:
      - Os dias seguintes são de telefone. Aliados ligam de Brasília com conselhos que se contradizem.
      - se: { tem: eua_dem_camara }
        texto: |
          Com os democratas no comando da Câmara, já se fala numa investigação sobre a atuação
          de funcionários americanos a favor da família. Ficar ficou mais caro.
        senao: |
          Com os republicanos firmes no Congresso, a Casa Branca não tem pressa de decidir nada.
          Ficar ficou mais confortável.
      - se: { tem: flavio_preventiva }
        texto: Voltar, agora, significa ser preso no desembarque.
        senao: Voltar ainda significa chegar livre. Por quanto tempo, ninguém sabe.
      - |
        Dele depende o que a direita vai ser em 2027: uma oposição com o líder no exílio, um
        mártir atrás das grades ou um senador que voltou para brigar.
    escolhas:
      - id: asilo
        rotulo: Flávio pede asilo formalmente aos Estados Unidos
        marca: [flavio_asilo]
        vai_para: itamaraty
      - id: volta_preso
        rotulo: Flávio anuncia que volta e vai se entregar à Polícia Federal
        se: { tem: flavio_preventiva }
        marca: [flavio_volta, flavio_preso]
        vai_para: aeroporto
      - id: volta_livre
        rotulo: Flávio anuncia que volta para se defender em liberdade
        se: { tem: flavio_sem_preventiva }
        marca: [flavio_volta]
        vai_para: aeroporto
      - id: exilio
        rotulo: Flávio não pede asilo e passa a fazer oposição de longe
        marca: [flavio_exilio]
        vai_para: pl

  - id: itamaraty
    lugar: Brasília, Palácio do Itamaraty
    imagem: imagens/cap01/itamaraty.webp
    texto:
      - O pedido de asilo chega à imprensa americana antes de chegar ao Itamaraty.
      - se: { tem: eua_dem_camara }
        texto: |
          Em Washington, a oposição a Trump promete transformar o caso num escândalo de
          interferência. O governo brasileiro ganhou aliados inesperados.
        senao: |
          Em Washington, ninguém no poder parece incomodado. Se o governo brasileiro reclamar,
          vai reclamar sozinho.
      - se: { tem: flavio_preventiva }
        texto: "E há um detalhe que ninguém esquece: o Brasil tem uma ordem de prisão contra o homem que pede proteção."
      - |
        No Planalto, a discussão é curta e tensa. Protestar dá razão a quem chama Flávio de
        perseguido. Calar dá razão a quem chama o governo de fraco.
    escolhas:
      - id: silencio
        rotulo: O governo diz que o caso é da Justiça e não protesta
        marca: [governo_silencio]
        vai_para: pl
      - id: protesto
        rotulo: O Itamaraty protesta formalmente e convoca o representante da embaixada americana
        marca: [crise_diplomatica]
        vai_para: pl

  - id: aeroporto
    lugar: Brasília, Aeroporto Internacional
    imagem: imagens/cap01/aeroporto.webp
    texto:
      - se: { tem: flavio_preso }
        texto: |
          A Polícia Federal espera na pista. Flávio desce a escada de terno escuro, acena para
          um saguão que não vai atravessar e entra num carro sem identificação.
        senao: |
          Não há policiais na pista, só jornalistas. Flávio desce a escada, acena e diz uma
          frase só: veio para ficar.
      - Do lado de fora, o que vai ficar na memória é o tamanho da recepção.
    escolhas:
      - id: multidao
        rotulo: Milhares de apoiadores cercam o aeroporto
        marca: [volta_multidao]
        vai_para: pl
      - id: discreto
        rotulo: O desembarque é de madrugada, e quase ninguém aparece
        marca: [volta_discreta]
        vai_para: pl

  - id: pl
    lugar: Brasília, sede do PL
    imagem: imagens/cap01/pl.webp
    texto:
      - se: { todas: [{ tem: flavio_volta }, { nao_tem: flavio_preso }] }
        texto: A executiva do partido se reúne numa sala comprida. Flávio está lá, mas quem conduz é Valdemar.
        senao: A executiva do partido se reúne numa sala comprida. A cadeira da cabeceira fica vazia de propósito.
      - |
        Em nota, o partido reconheceu o resultado da eleição. Flávio, não. O PL fez a maior
        bancada do Congresso, mas maior não é maioria: em fevereiro, Câmara e Senado elegem seus
        presidentes, e o Centrão já conversa com o governo.
      - se: { tem: crise_diplomatica }
        texto: O protesto do Itamaraty deu ao partido uma bandeira, a de defender um brasileiro perseguido.
      - se: { tem: volta_multidao }
        texto: As imagens do aeroporto ainda rodam nas redes. A base quer briga.
      - se: { tem: flavio_preso }
        texto: Com Flávio preso, cada fala de cada deputado do partido vira notícia, e risco.
      - se: { tem: flavio_exilio }
        texto: Cada vídeo de Flávio vindo de Miami rende milhões de visualizações, e um problema para quem precisa negociar em Brasília.
      - |
        Ninguém diz em voz alta, mas todos na sala sabem: quem negociar agora vai ter que
        explicar a negociação depois.
    escolhas:
      - id: negocia
        rotulo: O PL deixa a tese de fraude para Flávio e senta para negociar as mesas
        marca: [pl_negocia]
      - id: obstrui
        rotulo: O PL fecha com Flávio, encampa a tese de fraude e promete obstruir o governo
        marca: [pl_obstrui]

saidas:
  - para: FIM
