versao: "0.4.0"
titulo: Trama
aviso: >
  Trama é uma obra de ficção especulativa. Figuras públicas aparecem como
  personagens em situações hipotéticas, inspiradas em suas posições públicas.
  Nenhuma cena descreve fatos reais além do prólogo.

# Fatos reais, não jogáveis. A primeira decisão é o acontecimento seguinte ao último fato.
prologo:
  - data: 4 de outubro de 2026
    texto: Flávio Bolsonaro (PL) termina o primeiro turno à frente, com 47,0% contra 45,2% de Lula.
    fonte: https://pt.wikipedia.org/wiki/Elei%C3%A7%C3%A3o_presidencial_no_Brasil_em_2026
  - data: 25 de outubro de 2026
    texto: >
      Lula vira no segundo turno e é reeleito com 51,8% dos votos válidos. É a primeira vez
      que o segundo colocado no primeiro turno vence a eleição. O PL elege a maior bancada
      da Câmara (121 deputados) e do Senado.
    fonte: https://tvbrasil.ebc.com.br/reporter-brasil-tarde/2026/10/eleicoes-2026-pl-forma-maior-bancada-no-congresso
  - data: 26 de outubro de 2026
    texto: O STF determina a apreensão do passaporte de Flávio e o proíbe de deixar o país.
    fonte: https://www.gazetadopovo.com.br/republica/pf-confirma-flavio-bolsonaro-deixou-brasil/
  - data: 27 de outubro de 2026
    texto: >
      Flávio deixa o Brasil rumo aos Estados Unidos. Registros argentinos noticiados indicam
      travessia por Foz do Iguaçu e um jato com escala no Equador; o governo argentino nega
      qualquer participação.
    fonte: https://www.nexojornal.com.br/expresso/2026/10/27/flavio-bolsonaro-fugiu-argentina-pf-passaporte
  - data: 28 de outubro de 2026
    texto: >
      Flávio desembarca em Miami. O Departamento de Estado confirma vistos para ele e a família.
      Aliados falam em asilo, sem confirmação oficial. Ele não é foragido: é investigado em três
      inquéritos no Supremo, sem denúncia, e continua senador até 31 de janeiro.
    fonte: https://www.metropoles.com/mundo/governo-trump-confirma-emissao-de-vistos-para-flavio-bolsonaro-e-familia
  - data: 28 de outubro de 2026, à noite
    texto: >
      Aliados divulgam uma carta em que Flávio se declara "o verdadeiro presidente eleito do
      Brasil". Sem apresentar provas, ele fala em fraude, agradece a Milei e a Trump, diz que vai
      liderar a oposição do exterior e chama Rogério Marinho de seu candidato à presidência do
      Senado. Fontes do PL dizem que o partido não tem relação com a carta.
    fonte: https://www.metropoles.com/mundo/em-carta-flavio-se-declara-verdadeiro-presidente-eleito-do-brasil
  - data: 28 de outubro de 2026, mais tarde
    texto: >
      Depois da repercussão, Flávio apaga a carta e publica uma nova versão. "Presidente eleito"
      vira "líder do Brasil". As acusações de fraude, de perseguição política e as críticas ao STF
      e ao TSE continuam no texto.
    fonte: https://www.congressoemfoco.com.br/noticia/129622/flavio-muda-carta-e-troca-presidente-eleito-por-lider-do-brasil

primeiro_capitulo: cap01

epilogo:
  id: epilogo
  titulo: O Brasil na virada de 2027
  texto:
    # Flávio
    - se: { tem: deportados }
      texto: Flávio e Eduardo voltaram ao Brasil num avião do governo americano. A família ganhou uma causa, Trump um acordo, e Lula uma acusação.
    - se: { todas: [{ tem: deportados }, { tem: flavio_preventiva }] }
      texto: Os dois irmãos passam a virada do ano presos.
    - se: { todas: [{ tem: deportados }, { tem: flavio_sem_preventiva }] }
      texto: Eduardo passa a virada do ano preso. Flávio, livre, a poucos quilômetros dele.
    - se: { tem: eua_protege }
      texto: Trump manteve a proteção aos dois irmãos. Em Miami, a família continua falando com o Brasil de longe.
    - se: { todas: [{ tem: flavio_preventiva }, { nao_tem: deportados }] }
      texto: Flávio entra em 2027 com uma ordem de prisão no Brasil e uma autorização para ficar nos Estados Unidos. Os dois papéis valem, cada um no seu país.
    - se: { tem: bens_bloqueados }
      texto: Os bens dele no Brasil estão bloqueados. Em Miami, isso vira prova de perseguição; em Brasília, prova de que a Justiça age.
    - se: { tem: bloqueio_negado }
      texto: O pedido de bloqueio dos bens foi negado. O PT chama de leniência; a família, de reconhecimento tardio.
    - se: { tem: mandato_cassado_faltas }
      texto: O mandato dele acabou por faltas, numa sessão de quinze minutos que o PL não esquece.
    - se: { tem: mandato_decurso }
      texto: O mandato dele acabou sozinho, no último dia de janeiro, sem que ninguém precisasse assinar nada.
    - se: { tem: flavio_licenca }
      texto: Ele saiu do Senado de licença, e ninguém pôde dizer que foi expulso.
    - se: { todas: [{ tem: governo_exilio }, { nao_tem: deportados }] }
      texto: Em Miami, existe um governo que nenhum país reconhece e que milhões de brasileiros acompanham todas as noites.
    - se: { todas: [{ tem: flavio_live }, { nao_tem: deportados }] }
      texto: Toda noite, uma live de Miami disputa com o PL quem fala pela direita.
    # Supremo
    - se: { tem: stf_aprovado }
      texto: O Supremo volta a ter onze ministros. Um deles sabe exatamente a quem deve a cadeira, e os outros também.
    - se: { tem: stf_rejeitado }
      texto: O Supremo segue com dez ministros, e Lula, com duas derrotas no Senado. A próxima indicação vai custar mais.
    - se: { tem: vaga_segurada }
      texto: A cadeira vaga do Supremo entra em 2027 como moeda, e todo mundo em Brasília sabe o câmbio.
    - se: { tem: pgr_contra }
      texto: Entre a Procuradoria e o Supremo, abriu-se uma fresta. Os dois lados vão tentar alargá-la.
    # Direita
    - se: { tem: michelle_lider }
      texto: No Brasil, a oposição tem uma voz. Em Miami, alguém repara que ela não é da família inteira.
    - se: { tem: michelle_porta_voz }
      texto: Michelle fala pela família, e a família fala por ela. Ninguém sabe ainda onde termina uma e começa a outra.
    - se: { tem: direita_sem_dono }
      texto: A direita entra em 2027 sem dono, e Kassab, com a agenda cheia.
    # Mundo
    - se: { tem: crise_diplomatica }
      texto: O Itamaraty ainda espera respostas de Washington e de Buenos Aires. Ao cobrar, o governo deu à carta um lugar na agenda entre países.
    - se: { tem: governo_silencio }
      texto: O Planalto nunca respondeu à carta. Em Miami, o silêncio foi lido como medo; em Brasília, como cálculo.
    - se: { tem: caputo_investigado }
      texto: Em Puerto Iguazú, uma promotoria de fronteira guarda o plano de um voo. O governo argentino diz que ali não há nada além de um carimbo. A oposição argentina diz que há muito mais.
    - se: { tem: milei_silencio }
      texto: Em Buenos Aires, o caso esfriou nos tribunais. A oposição argentina guardou o assunto para a eleição de outubro.
    - se: { tem: eua_dem_camara }
      texto: Em Washington, a nova maioria marcou para janeiro as primeiras perguntas sobre o Brasil. A tarifa de 25%, essa, não depende dela.
    - se: { tem: eua_rep_congresso }
      texto: Em Washington, as perguntas sobre o Brasil ficam para depois. A tarifa de 25% fica para agora.
    - se: { tem: lula_trump_miami }
      texto: Lula e Trump abriram um canal em Miami. A tarifa não mudou, e cada um pode dizer que o outro usou o canal mal.
    - se: { tem: lula_sem_trump }
      texto: Em Miami, Lula e Trump estiveram na mesma sala e não conversaram. Em Pequim, alguém anotou.
    - se: { tem: lula_ausente_g20 }
      texto: A cadeira do Brasil no G20 de Miami ficou com o chanceler. A base do governo chamou de dignidade; a oposição, de isolamento.
    # Congresso
    - se: { tem: acordo_fechado }
      texto: "O Acordo fechou sem papel: Alcolumbre com votos do PL, cargos na Mesa, a gaveta dos impeachments fechada. Ele vale até fevereiro de 2029, quando Alcolumbre não pode mais ser reeleito."
    - se: { tem: guerra_fevereiro }
      texto: A primeira votação de 2027 é a eleição do Senado, e vale tudo. Quem perder em fevereiro vai passar dois anos pagando.
    - se: { tem: pl_rachado }
      texto: O PL entra em 2027 com a maior bancada e duas listas de votos. A maior força do Congresso é também a mais fácil de dividir.
    - se: { tem: pl_negocia }
      texto: A conversa que começou em novembro com mais de dois lados terminou o ano com todos eles anotando o preço.
    - se: { tem: pl_obstrui }
      texto: O PL escolheu a briga em novembro. O Centrão escolheu esperar para ver quem paga mais, e o governo, quanto vai pagar.
    - Este é o fim do capítulo 2. A história continua conforme a realidade andar.
