primeiro_capitulo: cap01

epilogo:
  id: epilogo
  titulo: O Brasil em fevereiro de 2027
  texto:
    # Flávio
    - se: { tem: deportados }
      texto: Flávio e Eduardo voltaram ao Brasil num avião do governo americano. A família ganhou uma causa, Trump um acordo, e Lula uma acusação.
    - se: { todas: [{ tem: deportados }, { tem: flavio_preso_no_brasil }] }
      texto: Os dois irmãos começam 2027 presos.
    - se: { todas: [{ tem: deportados }, { nao_tem: flavio_preso_no_brasil }] }
      texto: Eduardo começa 2027 preso. Flávio, fora da cadeia, a poucos quilômetros dele.
    - se: { todas: [{ tem: flavio_voltou }, { nao_tem: deportados }] }
      texto: Flávio voltou por conta própria. Para os aliados, foi coragem; para os adversários, falta de saída. Eduardo ficou em Miami.
    - se: { todas: [{ tem: flavio_preso_no_brasil }, { nao_tem: deportados }] }
      texto: Flávio começa 2027 preso em Brasília, a poucos quilômetros do pai.
    - se: { tem: tornozeleira }
      texto: Flávio começa 2027 em casa, de tornozeleira, sem poder falar.
    - se: { tem: ato_anistia }
      texto: A anistia saiu de dezembro com rua e sem votos. Em 2027, os dois lados vão medir quanto vale uma coisa sem a outra.
    - se: { tem: pl_distancia_flavio }
      texto: Com Flávio no Brasil, o PL passou dezembro e janeiro sem dizer o nome dele. Sem mandato, ele virou o nome que o partido evita.
    - se: { tem: contra_ato }
      texto: Em dezembro, a anistia levou duas ruas a Brasília e a São Paulo. Em 2027, o Senado vai votar com as duas lá fora.
    - se: { tem: base_em_casa }
      texto: Lula pediu que a base não fosse às ruas, e ela não foi. A anistia teve rua de um lado só, e a militância cobrou o silêncio.
    - se: { tem: pgr_pede_arquivamento }
      texto: A Procuradoria pediu para arquivar um dos inquéritos contra Flávio. A defesa usa o pedido como prova; o PT, como sinal de que a acusação recua.
    - se: { tem: pl_usa_flavio }
      texto: O nome de Flávio entrou na negociação do Senado. Ninguém diz em voz alta o preço, e todos sabem que existe.
    - se: { tem: eua_protege }
      texto: Trump manteve a proteção aos dois irmãos. Em Miami, a família continua falando com o Brasil de longe.
    - se: { todas: [{ tem: flavio_preventiva }, { nao_tem: flavio_voltou }] }
      texto: Flávio entra em 2027 com uma ordem de prisão no Brasil e uma autorização para ficar nos Estados Unidos. Os dois papéis valem, cada um no seu país.
    - se: { todas: [{ tem: interpol_aceita }, { nao_tem: flavio_voltou }] }
      texto: Com o alerta da Interpol, Flávio pode ficar nos Estados Unidos, mas não pode sair de lá sem risco de ser preso.
    - se: { tem: prisao_derrubada }
      texto: Em novembro, o Senado derrubou a prisão de Flávio. Os senadores que votaram contra ela vão ser lembrados, dos dois lados, até 2030.
    - se: { tem: bloqueio_sem_prisao }
      texto: Moraes não mandou prender Flávio, mas bloqueou parte dos bens dele. O PT achou pouco; o PL, demais.
    - se: { tem: asilo_pedido }
      texto: Flávio pediu asilo político nos Estados Unidos. Enquanto o pedido anda, a permanência dele lá fica mais segura, e a volta, mais difícil de explicar.
    - se: { tem: chanceler_interpelado }
      texto: Em Buenos Aires, o chanceler teve de explicar ao Congresso a passagem de Flávio. Milei ficou calado, e a oposição argentina, não.
    - se: { tem: caso_com_rubio }
      texto: O caso de Flávio passou de Mauro Vieira a Rubio, sem nota. Em Washington, ele virou mais um item da conversa sobre a taxa.
    - se: { tem: pedido_policial }
      texto: O Brasil pediu os dados da saída de Flávio pela Polícia Federal, sem nota nem discurso. A resposta argentina ainda não chegou.
    - se: { tem: eua_senado_rep }
      texto: Nos Estados Unidos, a Câmara mudou de lado e o Senado, não. Trump perdeu uma casa e manteve a que aprova indicações e tratados.
    - se: { tem: interpol_recusa }
      texto: A Interpol se recusou a caçar Flávio. No Brasil ele é foragido; no resto do mundo, só um político que perdeu a eleição.
    - se: { tem: extradicao_pedida }
      texto: O pedido de extradição está na mesa de Washington. Trump ainda não respondeu, e não tem pressa.
    - se: { tem: extradicao_em_fevereiro }
      texto: O pedido de extradição, guardado para fevereiro, sai com Flávio já sem mandato. Agora a resposta é de Washington.
    - se: { tem: interpol_espera }
      texto: A Interpol ainda não decidiu se põe Flávio no alerta internacional. Enquanto isso, ele viaja pouco e com cuidado.
    - se: { tem: extradicao_guardada }
      texto: O governo nunca pediu a extradição. A base do PT chama de omissão; o Itamaraty, de cálculo.
    - se: { tem: bens_bloqueados }
      texto: Os bens dele no Brasil estão bloqueados. Em Miami, isso vira prova de perseguição; em Brasília, prova de que a Justiça age.
    - se: { tem: bloqueio_negado }
      texto: O pedido de bloqueio dos bens foi negado. O PT chama de leniência; a família, de reconhecimento tardio.
    - se: { tem: mandato_cassado_faltas }
      texto: O mandato dele acabou por faltas, numa sessão de quinze minutos que o PL não esquece.
    - se: { tem: mandato_decurso }
      texto: O mandato dele acabou sozinho, no último dia de janeiro, sem que ninguém precisasse assinar nada.
    - se: { tem: flavio_licenca }
      texto: Ele saiu do Senado de licença, e ninguém pôde dizer que foi expulso.
    - se: { todas: [{ tem: governo_exilio }, { nao_tem: flavio_voltou }] }
      texto: Em Miami, existe um governo que nenhum país reconhece e que milhões de brasileiros acompanham todas as noites.
    - se: { todas: [{ tem: flavio_live }, { nao_tem: flavio_voltou }] }
      texto: Toda noite, uma live de Miami disputa com o PL quem fala pela direita.
    - se: { todas: [{ tem: flavio_discreto }, { nao_tem: flavio_voltou }] }
      texto: Flávio quase não falou desde novembro. A família chama de estratégia; parte da base, de abandono.
    # Contas do governo (o_orcamento): cada saída com ganho e custo; o efeito na economia fica para 2027.
    - se: { tem: ajuste_corte }
      texto: O governo entra em 2027 cortando gastos. O mercado aplaude com cautela, e a militância que fez a virada de 2026 pergunta se foi para isso.
    - se: { tem: ajuste_adiado }
      texto: O governo entra em 2027 sem cortar. Os programas ficam, a base agradece, e o mercado e o Centrão passam a cobrar mais caro.
    - se: { tem: ajuste_menor }
      texto: O Congresso aprovou um ajuste menor que o prometido, pago em emendas. O mercado achou pouco, o Centrão achou bom, e a conta de 2027 ficou para depois.
    - se: { tem: ajuste_imposto }
      texto: O governo pede ao Congresso que cobre mais imposto de quem ganha mais. A esquerda comemora; o Congresso novo, mais à direita, avisa que não vota sem contrapartida.
    # Supremo
    - se: { tem: stf_aprovado }
      texto: O Supremo volta a ter onze ministros. O novo chega com apoio no Senado e com cobranças de quem o apoiou.
    - se: { tem: stf_rejeitado }
      texto: O Supremo segue com dez ministros, e Lula, com duas derrotas no Senado. A próxima indicação vai custar mais.
    - se: { tem: vaga_segurada }
      texto: A cadeira vaga do Supremo entra em 2027 como moeda de negociação entre o Planalto e o Senado.
    - se: { tem: votacao_adiada }
      texto: O indicado de Lula esperou o Natal e janeiro. Agora quem decide é o Senado novo, mais à direita.
    - se: { tem: pgr_contra }
      texto: Entre a Procuradoria e o Supremo, abriu-se uma fresta. Os dois lados vão tentar alargá-la.
    # Direita
    - se: { tem: michelle_lider }
      texto: No Brasil, a oposição tem uma voz. Em Miami, a família pergunta se ela fala por todos.
    - se: { tem: tarcisio_lider }
      texto: A oposição tem endereço em São Paulo. Em Miami, a família espera para ver quanto dos votos de Bolsonaro vai junto.
    - se: { tem: direita_sem_dono }
      texto: A direita entra em 2027 sem dono, e Kassab, com a agenda cheia.
    # Mundo
    - se: { tem: crise_diplomatica }
      texto: O Itamaraty ainda espera respostas de Washington e de Buenos Aires. Ao cobrar, o governo deu à carta um lugar na agenda entre países.
    - se: { tem: governo_silencio }
      texto: O Planalto nunca respondeu à carta. Em Miami, o silêncio foi lido como medo; em Brasília, como cálculo.
    - se: { tem: caputo_investigado }
      texto: Em Puerto Iguazú, uma promotoria de fronteira guarda o plano de um voo. O governo argentino diz que ali não há nada além de um carimbo. A oposição argentina diz que há muito mais.
    - se: { tem: milei_silencio }
      texto: Em Buenos Aires, a investigação não achou participação do governo. Milei saiu calado, como entrou, e a oposição argentina guardou o assunto para a eleição de outubro.
    - se: { tem: eua_dem_camara }
      texto: Em Washington, a nova maioria fez em janeiro as primeiras perguntas sobre o Brasil. A tarifa de 25%, essa, não depende dela.
    - se: { tem: eua_rep_congresso }
      texto: Em Washington, as perguntas sobre o Brasil ficam para depois. A tarifa de 25% fica para agora.
    - se: { tem: lula_trump_miami }
      texto: Lula e Trump abriram um canal em Miami. A tarifa não mudou, e cada um pode dizer que o outro usou o canal mal.
    - se: { tem: lula_sem_trump }
      texto: Em Miami, Lula e Trump estiveram na mesma sala e não conversaram. Em Pequim, alguém anotou.
    - se: { tem: lula_ausente_g20 }
      texto: A cadeira do Brasil no G20 de Miami ficou com o chanceler. A base do governo chamou de dignidade; a oposição, de isolamento.
    # Congresso
    - se: { tem: acordo_fechado }
      texto: "O Acordo fechou sem papel: Alcolumbre com votos do PL, cargos na Mesa, a gaveta dos impeachments fechada. Ele vale até fevereiro de 2029, quando Alcolumbre não pode mais ser reeleito."
    - se: { tem: guerra_fevereiro }
      texto: Em fevereiro, a eleição do Senado valeu tudo. Quem perdeu vai passar dois anos pagando.
    - se: { tem: pl_rachado }
      texto: O PL entra em 2027 com a maior bancada e duas listas de votos. A maior força do Congresso é também a mais fácil de dividir.
    - se: { tem: pl_negocia }
      texto: A conversa que começou em novembro com mais de dois lados terminou o ano com todos eles anotando o preço.
    - se: { tem: pl_obstrui }
      texto: O PL escolheu a briga em novembro. O Centrão escolheu esperar para ver quem paga mais, e o governo, quanto vai pagar.
    - se: { tem: tereza_recusa }
      texto: Tereza Cristina recusou o jantar de Alcolumbre e levou a disputa até o voto secreto.
    - se: { tem: lula_por_alcolumbre }
      texto: Lula pôs o governo na eleição do Senado. O resultado de fevereiro é dele também.
    - se: { tem: indulto_dado }
      texto: Jair começa 2027 perdoado por Lula. O perdão vai ser contestado no Supremo, e cobrado nas duas bases.
    - se: { tem: indulto_em_aberto }
      texto: O pedido de indulto a Jair entra em 2027 sem resposta. Cada lado conta o silêncio de Lula a seu favor.
    - se: { tem: indulto_recusado }
      texto: Lula recusou o indulto. A anistia ficou para o Senado novo, que começa com essa conta na mesa.
    - se: { tem: senado_sem_a_direita }
      texto: Alcolumbre fechou o Senado com o governo e deixou o PL de fora. A maior bancada do Congresso começa 2027 sem cargo e sem motivo para votar com Lula.
    - se: { tem: familia_em_guerra }
      texto: A família Bolsonaro brigou em público pela herança. Em 2027, a direita vai ter de escolher entre os votos da família e os da paz.
    - se: { tem: flavio_coleira }
      texto: Trump manteve Flávio nos Estados Unidos e cobrou silêncio em troca. Flávio fala menos, e cada palavra dele passa a ter dono.
    - se: { tem: lula_xi_miami }
      texto: Em Miami, Lula saiu com uma conversa com Xi e sem a foto com Trump. A China comprou mais; Washington anotou.
    - se: { tem: bloqueio_adiado }
      texto: O bloqueio dos bens de Flávio ficou para 2027. Moraes esperou a Procuradoria, e o PT esperou com ele, sem paciência.
    - se: { tem: indicacao_retirada }
      texto: Lula retirou o nome antes do voto. A cadeira do Supremo entra em 2027 vazia, e a próxima indicação começa do zero.
    - se: { tem: lula_cobra }
      texto: Lula apoiou Alcolumbre e mandou a conta junto. Em 2027, o PT vai cobrar cada linha.
    - se: { tem: lula_neutro }
      texto: Lula deixou o Senado decidir sozinho. Quem ganhou em fevereiro não deve nada ao Planalto.
    - se: { tem: tereza_aceita }
      texto: A frente de novembro acabou num jantar de dezembro. Em 2027, quem quiser unir a direita no Senado vai ter de começar de novo.
    - se: { tem: oposicao_unida }
      texto: Em novembro, a direita aprendeu a juntar PL e PP num nome só. Alcolumbre e o governo anotaram como ela fez.
    - se: { tem: pl_espera }
      texto: Em novembro, o PL preferiu esperar. A espera deixou espaço para quem queria escolher por ele.
    # A posse e as mesas (cap03)
    - se: { tem: fazenda_fonteles }
      texto: Fonteles está na Fazenda, e o PT já tem um nome para 2030. Se a conta doer, o nome paga primeiro.
    - se: { tem: fazenda_alckmin }
      texto: Alckmin cuida das contas como vice. O PT tem o governo e ainda não tem um candidato.
    - se: { tem: fazenda_haddad }
      texto: Haddad voltou à Fazenda. O PT tem de novo o nome de sempre, e a fila de sempre.
    - se: { tem: fazenda_durigan }
      texto: Lula não escolheu herdeiro. A Fazenda segue com um técnico, e a disputa de 2030 corre dentro do governo.
    - se: { tem: centrao_cobrado }
      texto: O Centrão entrou no governo com a condição de votar junto. Cada voto dele agora é contado.
    - se: { tem: centrao_livre }
      texto: O Centrão tem ministérios e voto livre. O governo tem uma base grande no papel.
    - se: { tem: cargos_guardados }
      texto: Parte dos cargos ainda está na gaveta de Lula, esperando quem merecer.
    - se: { tem: centrao_fora }
      texto: O Centrão ficou fora do núcleo do governo, e o governo, sem maioria certa.
    - se: { tem: casos_no_supremo }
      texto: Os casos de Flávio seguem no Supremo. A defesa fala em perseguição; a acusação, em regra.
    - se: { tem: casos_divididos }
      texto: Parte dos casos de Flávio foi para um juiz comum. A defesa ganhou tempo; a acusação, um processo mais lento.
    - se: { tem: casos_em_espera }
      texto: O Supremo ainda não decidiu onde ficam os casos de Flávio. Os dois lados contam o tempo a seu favor.
    - se: { tem: camara_sem_pt }
      texto: Na Câmara, o PL entrou no bloco de Motta e o PT saiu. O partido do presidente começa o mandato sem as comissões que queria.
    - se: { tem: camara_sem_pl }
      texto: Na Câmara, o PL ficou fora do bloco. A maior bancada preside as comissões que sobraram.
    - se: { tem: camara_de_todos }
      texto: Na Câmara, PT e PL dividem o bloco de Motta, como em 2023. As duas bases não perdoam.
    - se: { tem: troca_pelo_senado }
      texto: O PL deu a Câmara a Motta em troca de votos no Senado. Agora sabe quanto vale a palavra do Centrão.
    - se: { tem: alcolumbre_folga }
      texto: Alcolumbre tem mais dois anos de Senado, os últimos. Em 2029, a cadeira fica vaga.
    - se: { tem: alcolumbre_apertado }
      texto: Alcolumbre ganhou por poucos votos e ainda procura quem não votou.
    - se: { tem: oposicao_retira }
      texto: A oposição desistiu do Senado no último dia e ficou com cargos na Mesa. Em 2029, vai ter de explicar à própria base por quê.
    - se: { tem: oposicao_no_senado }
      texto: A oposição preside o Senado. Em 2027, cada votação do governo vai passar por ela.
    - Este é o fim do capítulo 3 e do primeiro ato. A história vai até a eleição de 2030, e os próximos capítulos saem à medida que a realidade andar.
