versao: "0.4.0"
titulo: Trama
aviso: >
  Trama é uma obra de ficção especulativa. Figuras públicas aparecem como
  personagens em situações hipotéticas, inspiradas em suas posições públicas.
  Nenhuma cena descreve fatos reais além do prólogo.

# Fatos reais, não jogáveis. A primeira decisão é o acontecimento seguinte ao último fato.
prologo:
  - data: 4 de outubro de 2026
    texto: Flávio Bolsonaro (PL) termina o primeiro turno à frente, com 47,0% contra 45,2% de Lula.
    fonte: https://pt.wikipedia.org/wiki/Elei%C3%A7%C3%A3o_presidencial_no_Brasil_em_2026
  - data: 25 de outubro de 2026
    texto: >
      Lula vira no segundo turno e é reeleito com 51,8% dos votos válidos. É a primeira vez
      que o segundo colocado no primeiro turno vence a eleição. O PL elege a maior bancada
      da Câmara (121 deputados) e do Senado.
    fonte: https://tvbrasil.ebc.com.br/reporter-brasil-tarde/2026/10/eleicoes-2026-pl-forma-maior-bancada-no-congresso
  - data: 26 de outubro de 2026
    texto: O STF determina a apreensão do passaporte de Flávio e o proíbe de deixar o país.
    fonte: https://www.gazetadopovo.com.br/republica/pf-confirma-flavio-bolsonaro-deixou-brasil/
  - data: 27 de outubro de 2026
    texto: >
      Flávio deixa o Brasil rumo aos Estados Unidos. Registros argentinos noticiados indicam
      travessia por Foz do Iguaçu e um jato com escala no Equador; o governo argentino nega
      qualquer participação.
    fonte: https://www.nexojornal.com.br/expresso/2026/10/27/flavio-bolsonaro-fugiu-argentina-pf-passaporte
  - data: 28 de outubro de 2026
    texto: >
      Flávio desembarca em Miami. O Departamento de Estado confirma vistos para ele e a família.
      Aliados falam em asilo, sem confirmação oficial. Ele não é foragido: é investigado em dois
      inquéritos, sem denúncia, e continua senador até 31 de janeiro.
    fonte: https://www.metropoles.com/mundo/governo-trump-confirma-emissao-de-vistos-para-flavio-bolsonaro-e-familia
  - data: 28 de outubro de 2026, à noite
    texto: >
      Aliados divulgam uma carta em que Flávio se declara "o verdadeiro presidente eleito do
      Brasil". Sem apresentar provas, ele fala em fraude, agradece a Milei e a Trump, diz que vai
      liderar a oposição do exterior e chama Rogério Marinho de seu candidato à presidência do
      Senado. Fontes do PL dizem que o partido não tem relação com a carta.
    fonte: https://www.metropoles.com/mundo/em-carta-flavio-se-declara-verdadeiro-presidente-eleito-do-brasil
  - data: 28 de outubro de 2026, mais tarde
    texto: >
      Depois da repercussão, Flávio apaga a carta e publica uma nova versão. "Presidente eleito"
      vira "líder do Brasil". As acusações de fraude, de perseguição política e as críticas ao STF
      e ao TSE continuam no texto.
    fonte: https://www.congressoemfoco.com.br/noticia/129622/flavio-muda-carta-e-troca-presidente-eleito-por-lider-do-brasil

primeiro_capitulo: cap01

epilogo:
  id: epilogo
  titulo: Até aqui
  texto:
    - se: { tem: flavio_preventiva }
      texto: Flávio terminou novembro com uma ordem de prisão no Brasil e um visto nos Estados Unidos. Os dois papéis valem, cada um no seu país.
    - se: { tem: flavio_sem_preventiva }
      texto: Flávio terminou novembro sem ordem de prisão e com um mandato que diminui a cada sessão do Senado.
    - se: { tem: governo_exilio }
      texto: Em Miami, existe agora um governo que nenhum país reconhece e que metade do Brasil acompanha.
    - se: { tem: flavio_live }
      texto: Toda noite, uma transmissão de Miami disputa com o PL quem fala pela direita.
    - se: { tem: crise_diplomatica }
      texto: O Itamaraty ainda espera respostas de Washington e de Buenos Aires.
    - se: { tem: caputo_investigado }
      texto: Em Puerto Iguazú, uma promotoria de fronteira guarda o plano de um voo que dois governos prefeririam esquecer.
    - se: { tem: pgr_contra }
      texto: Entre a Procuradoria e o Supremo, abriu-se uma fresta. Os dois lados vão tentar alargá-la.
    - se: { tem: eua_dem_camara }
      texto: Em Washington, a nova maioria marcou para janeiro as primeiras perguntas sobre o Brasil.
    - se: { tem: eua_rep_congresso }
      texto: Em Washington, ninguém vai fazer perguntas sobre o Brasil tão cedo.
    - se: { tem: pl_negocia }
      texto: Em Brasília, o PL começou a conversar. Em algum gabinete, alguém anotou o preço.
    - se: { tem: pl_obstrui }
      texto: Em Brasília, o PL escolheu a briga. O Centrão escolheu esperar para ver quem paga mais.
    - Este é o fim do capítulo 1. A história continua no capítulo 2, que ainda está sendo escrito.
