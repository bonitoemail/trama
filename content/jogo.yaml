versao: "0.5.0"
titulo: Trama
aviso: >
  Trama é uma simulação. Figuras públicas aparecem como
  personagens em situações hipotéticas, inspiradas em suas posições públicas.
  Nenhuma cena descreve fatos reais além dos listados em "O que já aconteceu".
  As escolhas são contadas de forma anônima, sem nome, conta ou endereço de
  quem joga, para mostrar o que a comunidade decidiu.

# Capa: a linha sob o título. Os passos de "Como funciona" aparecem no fim de "O que é o Trama".
# Linguagem simples (DESIGN 8.2).
apresentacao:
  ficha: Simulação preditiva do Brasil até 2030
  passos:
    - titulo: Começa no último fato real
      texto: Parte do acontecimento mais recente, com data e fonte.
    - titulo: Você escolhe o que vem depois
      texto: De duas a quatro saídas por cena. Cada escolha deixa marcas.
    - titulo: Inventado, mas possível
      texto: Caminhos criados a partir de pesquisa de todos os lados.
    - titulo: A história anda com o tempo
      texto: Quando a realidade decide, o jogo se atualiza.

# Tela "O que é o Trama" (/o-que-e; /para-que-serve redireciona). {partidas} é contado pelo motor a
# cada build (contarPartidas): nunca escreva o número à mão.
objetivo:
  titulo: O que é o Trama
  texto: Um jeito de ver, antes de acontecer, aonde pode levar o que a gente apoia.
  etapas:
    - titulo: Ver a consequência
      texto: >
        Na política, a gente costuma torcer por uma decisão sem ver o que vem
        depois dela. Aqui você escolhe e acompanha o efeito: quem ganha, quem
        perde e quem paga a conta.
    - titulo: O Brasil de hoje até 2030
      texto: >
        A história começa no último fato real e vai até a próxima eleição para
        presidente. Os personagens são as figuras públicas de agora, agindo como
        poderiam agir.
    - titulo: Mais de {partidas} histórias
      texto: >
        Cada escolha deixa marcas que voltam mais adiante, e algumas levam a
        capítulos inteiros diferentes: Flávio preso, Flávio de volta ao Brasil,
        uma campanha pelo Senado. Hoje são mais de {partidas} histórias
        possíveis, e nenhuma é a certa.
    - titulo: Para qualquer lado
      destaque: O jogo não torce por ninguém.
      texto: >
        Todo lado tem motivo, interesse e custo. A ideia é que quem é de direita
        e quem é de esquerda vejam algo que não viam antes.
    - titulo: O que a comunidade escolheu
      texto: >
        As escolhas de quem joga são contadas de forma anônima, sem nome nem
        conta. Com o tempo, vamos mostrar o que a maioria escolheu em cada cena
        e comparar com o que a realidade fez.
  nota: >
    As cenas são simulação. Só é fato o que está em "O que já aconteceu" e em
    "Fatos e fontes", sempre com a fonte.

# Tela "Como fazemos as previsões". Fiel a roteiro/painel/ (00-agregado, regra de desenho)
# e à skill atualizar-jogo. Mudou o método? Mude aqui também.
metodo:
  titulo: Como fazemos as previsões
  texto: Os caminhos do Trama não saem da cabeça de uma pessoa. Saem de um método que dá para conferir.
  etapas:
    - titulo: Pesquisa
      texto: >
        Juntamos os fatos com data e fonte. Só vira fato o que tem documento
        oficial ou duas fontes independentes, de linhas editoriais diferentes.
        Wikipédia não conta. Boato fica marcado como boato. Em cada cena, "Fatos
        e fontes" mostra os links e separa o que é fato do que é leitura de cada
        lado.
    - titulo: Seis lentes
      texto: >
        Seis analistas simulados por IA respondem às mesmas perguntas, cada um
        pelo seu ângulo. Não são especialistas reais, e nenhuma previsão é
        atribuída a pessoas reais.
    - titulo: Consenso e divergência
      texto: >
        Comparamos as seis respostas. Onde concordam, nasce o caminho mais
        provável. Onde divergem, nasce uma das decisões difíceis do jogo. Os
        caminhos improváveis também entram: você pode ver o que aconteceria.
    - titulo: As escolhas que faltam
      texto: >
        Um revisor confere cada decisão contra a pesquisa. Se falta um desfecho
        provável, ou alguém importante de qualquer lado, ele entra. Nenhuma
        escolha sai só por ser improvável.
    - titulo: Um leitor de cada lado
      texto: >
        Dois leitores simulados por IA jogam todos os caminhos, um como eleitor
        de direita e outro como eleitor de esquerda, os dois moderados. Cada um
        aponta onde o próprio lado foi tratado com injustiça e onde o outro foi
        poupado. Corrigimos o que os dois apontam e o que for grave para
        qualquer um deles.
    - titulo: A realidade confere
      texto: >
        Uma rodada diária busca as notícias. A escolha que se confirmou fica
        travada, as cenas do caminho real são reescritas, e um caminho que a
        realidade abriu e o jogo não tinha passa a existir. Cada mudança fica
        no histórico público, quando publicada.
  lentes:
    - nome: Instituições
      texto: Congresso, Supremo e a relação entre os Poderes.
    - nome: Economia ortodoxa
      texto: Contas públicas, juros e confiança do mercado.
    - nome: Economia heterodoxa
      texto: Renda, emprego e o peso dos juros na dívida.
    - nome: Jurídico
      texto: O que a lei permite e quanto tempo cada processo leva.
    - nome: Internacional
      texto: EUA, América Latina e China, o Brasil visto de fora.
    - nome: Eleitoral
      texto: Voto, rejeição e quanto um líder consegue transferir.
  nota: >
    Nenhum número aparece durante o jogo, para não induzir a escolha. As seis
    lentes leem a mesma base de pesquisa: quando concordam, pode ser fonte em
    comum, e não acordo independente. Os revisores e os dois
    leitores também são agentes de IA, não pessoas: servem para pegar o que
    escapou, não para garantir que nada escapou.
  codigo:
    titulo: Tudo aberto para conferir
    texto: >
      O código do jogo está publicado, junto com as cenas, os fatos com fonte e o
      texto exato que cada agente de IA recebeu: a pesquisa, as seis lentes, o
      agregador e as revisões de equilíbrio. As ilustrações saem de um modelo de
      imagem aberto, rodando no nosso computador, e o prompt e a seed de cada uma
      também estão lá. Qualquer pessoa pode rodar os mesmos prompts e comparar com
      o que publicamos. O texto dos agentes nunca sai igual, mas as previsões
      devem ficar parecidas; se não ficarem, dá para apontar.
    links:
      - rotulo: Os prompts de cada agente e como repetir
        url: https://github.com/bonitoemail/trama/tree/main/roteiro/prompts
      - rotulo: Como as imagens são feitas
        url: https://github.com/bonitoemail/trama/blob/main/roteiro/prompts/imagens.md
      - rotulo: As respostas das seis lentes
        url: https://github.com/bonitoemail/trama/tree/main/roteiro/painel
      - rotulo: As cenas e os fatos, com as fontes
        url: https://github.com/bonitoemail/trama/tree/main/content
      - rotulo: O histórico de cada mudança
        url: https://github.com/bonitoemail/trama/commits/main
      - rotulo: O repositório completo
        url: https://github.com/bonitoemail/trama

