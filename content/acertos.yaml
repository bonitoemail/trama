    titulo: A Justiça argentina manda guardar as câmeras da fronteira
    previsto:
      data: "2026-10-28 18:12"
      commit: 86692d7
      onde: cap01/o_voo_fretado
      caminho: Na cena que aparece quando a investigação argentina chega perto do governo Milei
      texto: >
        "O pedido sai de uma promotoria federal de fronteira: câmeras do aeroporto, plano de voo,
        lista de passageiros e o contrato do fretamento."
    realidade:
      data: "2026-10-29"
      texto: >
        A pedido da promotora federal Paloma Ochoa, a juíza María Eugenia Capuchetti mandou
        preservar as imagens das câmeras da ponte, da imigração e do aeroporto de Puerto Iguazú, e
        pediu informações à imigração e à chancelaria argentinas.
      fontes:
        - https://www.baenegocios.com/politica/la-justicia-ordeno-preservar-las-camaras-de-seguridad-por-el-paso-de-flavio-bolsonaro-por-la-argentina/
        - https://www.0221.com.ar/nacional/la-justicia-investiga-la-salida-flavio-bolsonaro-argentina-y-pidio-informes-al-gobierno-javier-milei-n136602
        - https://www.dataclave.com.ar/poder/flavio-bolsonaro-complica-al-gobierno--investigan-que-paso-durante-su-salida-por-argentina_a6ae38d8516fea97ab620874c
    diferenca: >
      O pedido veio da promotora que atua com a juíza Capuchetti, não de uma promotoria de
      fronteira. Plano de voo, lista de passageiros e contrato ficaram de fora: a juíza recusou
      parte das medidas. A escolha da cena, se a investigação chega ao governo, continua aberta.

