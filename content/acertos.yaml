# "O jogo e a realidade" (tela /acertos, link discreto em "Como fazemos" e em /escolhas).
# Entra aqui o que uma cena escreveu ANTES e a realidade confirmou, ou não, DEPOIS, com o commit da
# cena (data e hora de Brasília, como no `git log`) e as fontes do fato (mesma regra do prólogo).
# status: confirmou (se confirmou) | nao_confirmou (a realidade foi por outro caminho e a cena foi reescrita).
# diferenca: no que se confirmou, o que não bateu; no que não se confirmou, o que mudou no jogo.
# Escolha travada não precisa entrar: já aparece no jogo. O que está "a confirmar" sai sozinho dos relógios.
titulo: O jogo e a realidade
texto: >
  O que as cenas escreveram antes e o que a realidade fez depois. Cada trecho aponta para o
  momento em que entrou no jogo, no histórico público, com data e hora, para conferir que veio
  antes do fato.
nota: >
  Uma cena que se confirma não decide a escolha do jogador: a escolha só fica travada quando a
  realidade escolhe entre as opções. O que não se confirma vira cena reescrita, e o histórico
  das rodadas mostra o que mudou e quando.
historico: https://github.com/bonitoemail/trama/blob/main/pesquisa/RODADAS.md
commits: https://github.com/bonitoemail/trama/commit/

itens:
