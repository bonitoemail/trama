<!doctype html>
<!--
  3/11 · sketch do dia em que a realidade decide a primeira aposta (cap01/eleicao_eua, midterms).
  Três peças: o post de stories do placar (para o Instagram do Trama), a linha na capa para quem
  volta e apostou, e o topo do placar em /escolhas. Números da simulação local de 31/10 (trava
  de mentira, desfeita): 378 votos antes de 3/11; 70% democratas nas duas casas, 20% divididas,
  10% republicanos. O resultado real ainda não existe: as duas versões do post cobrem o caso em que a
  maioria acerta e o caso em que erra. Se a realidade cair fora das três opções (democratas só no
  Senado, por exemplo), entra uma opção nova travada e o post diz que ninguém apostou nisso.
  Linguagem da capa B3: Unbounded só no título, Source Serif 4 para ler, IBM Plex Sans para o resto.
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trama · O dia 3 de novembro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;1,8..60,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --fundo: #111314; --texto: #ece8df; --texto-2: #9d9a93; --texto-3: #6b6862; --linha: #26292b; --real: #f29a2e;
  --serif: 'Source Serif 4', Georgia, serif; --sans: 'IBM Plex Sans', system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: #0a0b0b; color: var(--texto); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
main { padding: 32px 16px 64px; display: flex; flex-wrap: wrap; gap: 40px; justify-content: center; align-items: flex-start; }
figure { margin: 0; }
figcaption { margin-top: 14px; max-width: 360px; font-size: 13px; line-height: 1.5; color: var(--texto-2); }
figcaption b { color: var(--texto); font-weight: 500; }
h1.secao { width: 100%; max-width: 800px; margin: 24px auto 0; font-family: var(--serif); font-weight: 500; font-size: 22px; }

.marca { font-family: 'Unbounded', sans-serif; font-weight: 500; text-transform: uppercase; letter-spacing: .04em; line-height: .95; margin: 0;
  background: linear-gradient(105deg, var(--texto) 0%, var(--texto) 30%, #2fae5b 42%, #f7d23e 50%, #2fae5b 58%, var(--texto) 70%, var(--texto) 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent; }

/* Post de stories (1080×1920, mostrado em 1/3). */
.moldura { width: 360px; height: 640px; overflow: hidden; border-radius: 14px; box-shadow: 0 0 0 1px var(--linha); }
.post { width: 1080px; height: 1920px; transform: scale(.3333); transform-origin: 0 0; background: var(--fundo); display: flex; flex-direction: column; padding: 120px 96px 104px; }
.post .marca { font-size: 72px; }
.post .antes { font-family: var(--serif); font-size: 50px; line-height: 1.3; color: var(--texto-2); margin: 96px 0 0; }
.post .numero { font-family: var(--serif); font-weight: 500; font-size: 260px; line-height: .9; margin: 56px 0 0; letter-spacing: -.02em; }
.post .frase { font-family: var(--serif); font-size: 58px; line-height: 1.25; margin: 28px 0 0; }
.post ul { list-style: none; margin: 88px 0 0; padding: 0; }
.post li { padding: 26px 0; border-top: 2px solid var(--linha); }
.post li .l { display: flex; justify-content: space-between; gap: 40px; font-family: var(--serif); font-size: 42px; line-height: 1.25; color: var(--texto-2); }
.post li em { font-style: normal; font-family: var(--sans); font-variant-numeric: tabular-nums; }
.post li .t { height: 8px; margin-top: 18px; background: var(--linha); border-radius: 4px; }
.post li .t i { display: block; height: 100%; background: var(--texto-3); border-radius: 4px; }
.post li.real .l { color: var(--texto); }
.post li.real .t i { background: var(--real); }
.post li.real small { display: block; font-family: var(--sans); font-size: 30px; color: var(--real); margin-top: 6px; }
.post .rodape { margin-top: auto; }
.post .pergunta { font-family: var(--serif); font-size: 46px; margin: 0 0 18px; }
.post .link { font-size: 36px; color: var(--texto-2); }

/* Telas do site (celular, 360 px). */
.tela { width: 360px; background: var(--fundo); border-radius: 14px; box-shadow: 0 0 0 1px var(--linha); padding: 28px 20px 32px; }
.tela .quando { margin: 0 0 10px; font-size: 13px; color: var(--texto-2); }
.tela h2 { font-family: var(--serif); font-weight: 500; font-size: 27px; line-height: 1.15; margin: 0 0 10px; }
.tela .fonte { font-size: 12px; color: var(--texto-2); text-decoration: underline; text-decoration-color: var(--linha); }
.tela .botao { display: block; width: 100%; min-height: 52px; margin-top: 28px; border: 0; border-radius: 12px; background: var(--texto); color: var(--fundo); font: 600 15px var(--sans); }
.tela .legenda { margin: 8px 0 0; text-align: center; font-size: 12px; color: var(--texto-2); }
.aposta { margin: 28px 0 0; padding: 16px 0 0; border-top: 1px solid var(--linha); font-family: var(--serif); font-size: 16px; line-height: 1.5; color: var(--texto-2); }
.aposta b { color: var(--texto); font-weight: 500; }
.aposta .sim { color: var(--real); }
.aposta a { display: inline-block; margin-top: 6px; font-family: var(--sans); font-size: 13px; color: var(--texto-2); text-decoration: underline; text-decoration-color: var(--linha); text-underline-offset: 3px; }
.tela .adiante { margin: 28px 0 0; font-family: var(--serif); font-size: 15px; line-height: 1.55; color: var(--texto-2); }

.tela.esc h3 { font-size: 20px; font-weight: 500; margin: 0 0 6px; }
.tela.esc .sub { margin: 0 0 18px; font-size: 14px; line-height: 1.5; color: var(--texto-2); }
.tela.esc .manchete { margin: 0 0 18px; font-family: var(--serif); font-size: 20px; line-height: 1.35; }
.tela.esc .manchete b { font-weight: 500; color: var(--real); }
.tela.esc .cena { margin: 0 0 10px; font-size: 13px; color: var(--texto-2); }
.tela.esc .cena b { color: var(--texto); font-weight: 500; }
.op { padding: 8px 0; }
.op .l { display: flex; justify-content: space-between; gap: 12px; font-size: 15px; line-height: 1.35; color: var(--texto-2); }
.op .t { height: 4px; margin-top: 6px; background: var(--linha); border-radius: 2px; }
.op .t i { display: block; height: 100%; background: var(--texto-3); border-radius: 2px; }
.op.real .l { color: var(--texto); }
.op.real .t i { background: var(--real); }
.op.real small { color: var(--real); font-size: 12px; margin-left: 6px; }
.tela.esc .votos { margin: 10px 0 0; font-size: 12px; color: var(--texto-3); }
</style>
</head>
<body>
<main>
  <h1 class="secao">1. O post do placar (stories do Trama, na noite ou na manhã seguinte)</h1>

  <figure>
    <div class="moldura"><div class="post">
      <p class="marca">Trama</p>
      <p class="antes">Antes da eleição americana, 378 jogadores do Trama apostaram.</p>
      <p class="numero">70%</p>
      <p class="frase">acertaram: os democratas ganharam a Câmara e o Senado.</p>
      <ul>
        <li class="real"><div class="l"><span>Democratas nas duas casas<small>aconteceu</small></span><em>70%</em></div><div class="t"><i style="width:70%"></i></div></li>
        <li><div class="l"><span>Câmara democrata, Senado republicano</span><em>20%</em></div><div class="t"><i style="width:20%"></i></div></li>
        <li><div class="l"><span>Republicanos mantêm a Câmara</span><em>10%</em></div><div class="t"><i style="width:10%"></i></div></li>
      </ul>
      <div class="rodape"><p class="pergunta">O que vem depois, você decide.</p><span class="link">tramabr.app</span></div>
    </div></div>
    <figcaption><b>Se a maioria acertar.</b> O número é de quem acertou; as três apostas embaixo, com a que aconteceu em laranja. Só votos de antes de 3/11 (a conta já corta por data).</figcaption>
  </figure>

  <figure>
    <div class="moldura"><div class="post">
      <p class="marca">Trama</p>
      <p class="antes">Antes da eleição americana, 378 jogadores do Trama apostaram.</p>
      <p class="numero">20%</p>
      <p class="frase">acertaram: democratas na Câmara, republicanos no Senado. 70% apostaram nas duas casas.</p>
      <ul>
        <li><div class="l"><span>Democratas nas duas casas</span><em>70%</em></div><div class="t"><i style="width:70%"></i></div></li>
        <li class="real"><div class="l"><span>Câmara democrata, Senado republicano<small>aconteceu</small></span><em>20%</em></div><div class="t"><i style="width:20%"></i></div></li>
        <li><div class="l"><span>Republicanos mantêm a Câmara</span><em>10%</em></div><div class="t"><i style="width:10%"></i></div></li>
      </ul>
      <div class="rodape"><p class="pergunta">O que vem depois, você decide.</p><span class="link">tramabr.app</span></div>
    </div></div>
    <figcaption><b>Se a maioria errar.</b> A surpresa vira o assunto: quem acertou é minoria, e a frase diz onde a maioria apostou. É o post mais forte dos dois.</figcaption>
  </figure>

  <h1 class="secao">2. No site, para quem volta</h1>

  <figure>
    <div class="tela">
      <p class="quando">Agora, 4 de novembro</p>
      <h2>Democratas ganham a Câmara e o Senado</h2>
      <span class="fonte">apnews.com</span>
      <button class="botao" type="button">Continuar partida</button>
      <p class="legenda">Capítulo 2, O espólio</p>
      <p class="aposta">Em 30 de outubro, você apostou que <b>os democratas ganhariam a Câmara e o Senado</b>. <span class="sim">Aconteceu.</span> 70% dos jogadores apostaram o mesmo.<br><a href="#">Ver o placar</a></p>
      <p class="adiante">Pela frente: <b style="color:var(--texto);font-weight:500">reunião do Copom, em 4 de novembro</b>.</p>
    </div>
    <figcaption><b>A linha na capa.</b> Só para quem tem a escolha numa partida salva neste aparelho: entre o botão e "Pela frente", em serifa, sem caixa nem cartão. Se errou: "Não aconteceu: os democratas ficaram com a Câmara, e os republicanos, com o Senado." Some depois de uma semana.</figcaption>
  </figure>

  <figure>
    <div class="tela esc">
      <h3>A realidade decidiu</h3>
      <p class="sub">Contam só as escolhas feitas antes da notícia.</p>
      <p class="manchete"><b>70%</b> dos jogadores acertaram, em 378 escolhas.</p>
      <p class="cena"><b>A eleição nos Estados Unidos</b>, cap. 1, em 3 de novembro</p>
      <div class="op real"><div class="l"><span>Os democratas ganham a Câmara e o Senado<small>aconteceu</small></span><span>70%</span></div><div class="t"><i style="width:70%"></i></div></div>
      <div class="op"><div class="l"><span>Democratas ganham a Câmara, e republicanos seguram o Senado</span><span>20%</span></div><div class="t"><i style="width:20%"></i></div></div>
      <div class="op"><div class="l"><span>Os republicanos, partido de Trump, mantêm a Câmara</span><span>10%</span></div><div class="t"><i style="width:10%"></i></div></div>
      <p class="votos">378 escolhas</p>
    </div>
    <figcaption><b>O placar em /escolhas.</b> Hoje a aposta decidida fica sob "Antes da notícia", só com a etiqueta "aconteceu" (conferi numa trava simulada). Proposta: um bloco próprio no topo, "A realidade decidiu", com quantos acertaram numa frase, e a barra que aconteceu em laranja. "Antes da notícia" continua embaixo, com o que ainda vai ser decidido.</figcaption>
  </figure>
</main>
</body>
</html>
